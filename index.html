<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場検査">
<meta name="theme-color" content="#1a1a2e">
<title>現場検査アプリ v2</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eaeaea;
    --text2: #8892a4;
    --ok: #2ecc71;
    --ng: #e74c3c;
    --check: #f39c12;
    --pin-size: 32px;
    --radius: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif; }

  #app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }

  /* HEADER */
  header {
    background: var(--surface);
    padding: 8px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(233,69,96,0.3);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; flex: 1; }
  .header-btn {
    background: var(--accent2); border: 1px solid var(--accent); color: var(--text);
    border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }

  /* FOLDER TABS */
  #folder-tabs {
    display: flex; overflow-x: auto; gap: 6px; padding: 5px 14px;
    background: var(--bg); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    scrollbar-width: none;
  }
  #folder-tabs::-webkit-scrollbar { display: none; }
  .folder-tab {
    flex-shrink: 0; padding: 4px 11px; border-radius: 16px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2); font-size: 12px; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
    transition: all 0.2s;
  }
  .folder-tab.active { background: rgba(233,69,96,0.2); border-color: var(--accent); color: var(--accent); }
  .folder-tab.add-btn { border-style: dashed; color: var(--text2); }
  .folder-tab .folder-del { font-size: 10px; opacity: 0.5; margin-left: 2px; }

  /* FLOOR TABS */
  #floor-tabs {
    display: flex; overflow-x: auto; gap: 8px; padding: 6px 14px;
    background: var(--surface2); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    scrollbar-width: none;
  }
  #floor-tabs::-webkit-scrollbar { display: none; }
  .floor-tab {
    flex-shrink: 0; padding: 4px 12px; border-radius: 20px;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2); font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .floor-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .floor-tab.add-btn { border-style: dashed; color: var(--accent); }

  /* MAIN CONTENT */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* PLAN VIEW */
  #plan-view { 
    flex: 1; position: relative; overflow: hidden; touch-action: none; background: #111;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #plan-canvas-wrap {
    position: absolute; transform-origin: 0 0;
    cursor: crosshair;
  }
  #plan-canvas-wrap img {
    display: block; max-width: none; pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  .no-plan {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; color: var(--text2);
  }
  .no-plan-icon { font-size: 64px; opacity: 0.3; }
  .no-plan p { font-size: 15px; }
  .upload-plan-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 12px 24px; border-radius: var(--radius); font-size: 15px; cursor: pointer;
  }

  /* PINS */
  .pin {
    position: absolute; transform: translate(-50%, -100%);
    width: var(--pin-size); cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    z-index: 10; transition: transform 0.15s;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pin * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .pin:active { transform: translate(-50%, -100%) scale(1.2); }
  .pin svg { width: 100%; height: auto; }
  .pin.status-ok svg .pin-fill { fill: var(--ok); }
  .pin.status-ng svg .pin-fill { fill: var(--ng); }
  .pin.status-check svg .pin-fill { fill: var(--check); }
  .pin.status-none svg .pin-fill { fill: var(--accent); }
  .pin-num {
    position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; color: #fff; pointer-events: none;
  }

  /* ステータスバッジ (ピン数字の下に表示) */
  .pin-badge {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 12px; height: 12px;
    padding: 0 2px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 900;
    line-height: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 2;
    border: 1px solid rgba(0,0,0,0.3);
  }
  .pin-badge.badge-ok { color: var(--ok); background: #fff; }
  .pin-badge.badge-ng { color: var(--ng); background: #fff; }
  .pin-badge.badge-check { color: var(--check); background: #fff; }

  /* TOOLBAR */
  #toolbar {
    background: var(--surface); border-top: 1px solid rgba(255,255,255,0.08);
    padding: 6px 14px; padding-bottom: calc(6px + var(--safe-bottom));
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .tool-btn {
    flex: 1; padding: 7px 4px; border-radius: 10px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2); font-size: 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: all 0.15s;
  }
  .tool-btn .icon { font-size: 18px; }
  .tool-btn.active, .tool-btn:active { background: var(--accent2); border-color: var(--accent); color: var(--accent); }

  /* MODALS */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: flex-end; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom));
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 90vh; overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

  /* SCROLL JUMP BUTTONS (pin-modal用) */
  #pin-jump-buttons {
    position: fixed;
    left: 12px;
    bottom: calc(90px + var(--safe-bottom));
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 105;
    pointer-events: none;
  }
  #pin-jump-buttons.show { display: flex; }
  .pin-jump-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(40,40,55,0.92);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 18px; font-weight: 700;
    display: flex;
    align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: auto;
    user-select: none; -webkit-user-select: none;
    transition: transform 0.1s, background 0.15s;
  }
  .pin-jump-btn:active { transform: scale(0.9); background: var(--accent); }

  /* PIN DETAIL */
  .pin-photos { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .photo-thumb {
    border-radius: 8px; overflow: hidden; background: var(--surface2);
    position: relative; cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
    -webkit-touch-callout: none;
  }

  /* REORDER MODE: ↑↓ ボタン */
  .reorder-controls {
    position: absolute; left: 50%; bottom: 8px;
    transform: translateX(-50%);
    display: none;
    flex-direction: row; gap: 6px;
    background: rgba(0,0,0,0.85);
    padding: 6px 8px;
    border-radius: 28px;
    backdrop-filter: blur(8px);
    z-index: 4;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    border: 1px solid var(--accent);
  }
  .photo-thumb.show-arrows .reorder-controls { display: flex; }
  .ro-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s, background 0.15s;
  }
  .ro-btn:active { transform: scale(0.9); background: var(--accent); }
  .ro-btn:disabled { opacity: 0.3; pointer-events: none; }
  .ro-btn.ro-close { background: rgba(255,255,255,0.1); font-size: 16px; }
  /* アクティブなサムネは赤い枠で強調 */
  .photo-thumb.show-arrows {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
    box-shadow: 0 0 16px rgba(233,69,96,0.6);
  }
  /* アクティブ時は保存/削除/チェックボックスを隠す (矢印操作に集中) */
  .photo-thumb.show-arrows .del-photo,
  .photo-thumb.show-arrows .save-photo,
  .photo-thumb.show-arrows .photo-check { display: none; }
  .photo-thumb img { width: 100%; height: auto; display: block; max-height: 400px; object-fit: contain; background: #000; }
  .photo-thumb .del-photo {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    border-radius: 50%; width: 40px; height: 40px;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .photo-thumb .del-photo:active { background: var(--ng); transform: scale(0.92); }
  .photo-thumb .save-photo {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    border-radius: 20px; height: 40px;
    padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .photo-thumb .save-photo:active { background: var(--accent); transform: scale(0.96); }
  .photo-thumb .photo-idx {
    position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.65);
    color: #fff; border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 600;
    pointer-events: none;
  }

  /* SELECT MODE */
  .photo-thumb .photo-check {
    position: absolute; top: 8px; left: 8px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.85);
    display: none;
    align-items: center; justify-content: center;
    color: transparent;
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    z-index: 3;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    transition: background 0.1s, color 0.1s;
  }
  #pin-photos.select-mode .photo-thumb .photo-check { display: flex; }
  #pin-photos.select-mode .photo-thumb.selected .photo-check {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  #pin-photos.select-mode .photo-thumb.selected {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
  }
  /* 選択モード中は保存/削除ボタンを隠す */
  #pin-photos.select-mode .photo-thumb .del-photo,
  #pin-photos.select-mode .photo-thumb .save-photo { display: none; }

  /* 選択モードのアクションバー */
  #select-action-bar {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    padding: 10px 14px calc(10px + var(--safe-bottom)) 14px;
    background: rgba(20,20,30,0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(233,69,96,0.4);
    display: none;
    align-items: center; gap: 8px;
    z-index: 110;
  }
  #select-action-bar.show { display: flex; }
  /* 選択モード中はモーダル下部に追加余白を作って、アクションバーに隠れないようにする */
  #pin-modal.select-active .modal {
    padding-bottom: calc(80px + var(--safe-bottom));
  }
  #select-action-bar .sel-count {
    color: var(--accent); font-weight: 700; font-size: 14px;
    margin-right: auto;
  }
  #select-action-bar button {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text); padding: 8px 12px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  #select-action-bar button:active { transform: scale(0.96); }
  #select-action-bar button.sel-save { background: var(--accent2); border-color: var(--accent); color: var(--accent); }
  #select-action-bar button.sel-delete { background: rgba(231,76,60,0.15); border-color: var(--ng); color: var(--ng); }
  #select-action-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .add-photo-btn {
    width: 100%; padding: 14px; border-radius: 8px; background: var(--surface2);
    border: 1px dashed rgba(255,255,255,0.2);
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 8px; color: var(--text2); font-size: 14px; cursor: pointer;
  }
  .add-photo-btn span { font-size: 22px; }

  textarea.memo {
    width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); border-radius: var(--radius); padding: 10px; font-size: 14px;
    min-height: 80px; resize: none; font-family: inherit;
    outline: none;
  }
  textarea.memo:focus { border-color: var(--accent); }

  .status-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .status-chip {
    flex: 1; padding: 8px 4px; border-radius: 8px; text-align: center;
    font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent;
    transition: all 0.15s;
  }
  .status-chip.ok { background: rgba(46,204,113,0.15); color: var(--ok); }
  .status-chip.ng { background: rgba(231,76,60,0.15); color: var(--ng); }
  .status-chip.check { background: rgba(243,156,18,0.15); color: var(--check); }
  .status-chip.selected-ok { border-color: var(--ok); background: rgba(46,204,113,0.3); }
  .status-chip.selected-ng { border-color: var(--ng); background: rgba(231,76,60,0.3); }
  .status-chip.selected-check { border-color: var(--check); background: rgba(243,156,18,0.3); }

  .btn-primary {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 12px;
  }
  .btn_zip {
    width: 100%; padding: 12px; background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }
  .btn-zip {
    width: 100%; padding: 12px; background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }
  .btn-zip:active { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    width: 100%; padding: 12px; background: transparent; color: var(--ng);
    border: 1px solid var(--ng); border-radius: var(--radius); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }

  /* LIST VIEW */
  #list-view { flex: 1; overflow-y: auto; padding: 12px 16px; display: none; }
  .list-item {
    background: var(--surface); border-radius: var(--radius); padding: 12px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.06);
  }
  .list-pin-badge {
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    flex-shrink: 0;
  }
  .badge-ok { background: rgba(46,204,113,0.2); color: var(--ok); }
  .badge-ng { background: rgba(231,76,60,0.2); color: var(--ng); }
  .badge-check { background: rgba(243,156,18,0.2); color: var(--check); }
  .badge-none { background: rgba(233,69,96,0.2); color: var(--accent); }
  .list-item-info { flex: 1; min-width: 0; }
  .list-item-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .list-item-sub { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-photo-count { font-size: 12px; color: var(--text2); flex-shrink: 0; }

  /* FLOOR MODAL */
  .input-field {
    width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); border-radius: var(--radius); padding: 12px; font-size: 15px;
    outline: none; font-family: inherit; margin-bottom: 12px;
  }
  .input-field:focus { border-color: var(--accent); }

  /* PHOTO VIEWER */
  #photo-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    z-index: 200; display: none;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #photo-viewer.open { display: block; }

  /* 写真ビューア表示中は他のフローティングUIを完全に隠す */
  body.viewer-open #float-camera-btn,
  body.viewer-open #float-home-btn,
  body.viewer-open #pin-jump-buttons,
  body.viewer-open #select-action-bar { display: none !important; }
  #viewer-stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #photo-viewer img {
    max-width: 100%;
    max-height: calc(100vh - 80px);
    object-fit: contain;
    transform-origin: 0 0;
    will-change: transform;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #viewer-toolbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(8px + var(--safe-top)) 12px 8px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0));
    display: flex; align-items: center; gap: 8px;
    z-index: 10;
  }
  #viewer-counter {
    color: #fff; font-size: 14px; font-weight: 600;
    background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  .viewer-action-btn {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; width: 44px; height: 44px; border-radius: 50%;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    transition: transform 0.1s, background 0.15s;
  }
  .viewer-action-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.3); }
  .viewer-del-btn:active { background: var(--ng); }

  #viewer-nav-prev, #viewer-nav-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 64px;
    display: none;
    align-items: center; justify-content: center;
    color: rgba(255,255,255,0.7); font-size: 40px; font-weight: 300;
    background: rgba(0,0,0,0.3);
    cursor: pointer; user-select: none;
    z-index: 10;
  }
  #viewer-nav-prev { left: 0; border-radius: 0 8px 8px 0; }
  #viewer-nav-next { right: 0; border-radius: 8px 0 0 8px; }
  #viewer-nav-prev.show, #viewer-nav-next.show { display: flex; }
  #viewer-nav-prev:active, #viewer-nav-next:active {
    background: rgba(0,0,0,0.6); color: #fff;
  }

  #viewer-hint {
    position: absolute; bottom: calc(20px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.7);
    font-size: 11px; padding: 6px 14px; border-radius: 20px;
    pointer-events: none; transition: opacity 0.5s; white-space: nowrap;
    z-index: 10;
  }

  /* FLOATING CAMERA BUTTON */
  #float-camera-btn {
    position: fixed;
    bottom: calc(90px + var(--safe-bottom));
    right: 20px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    border: none; color: #fff;
    font-size: 26px;
    box-shadow: 0 4px 16px rgba(233,69,96,0.5);
    cursor: pointer;
    z-index: 150;
    display: none;
    align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  #float-camera-btn:active { transform: scale(0.9); }

  /* 図面に戻る家ボタン (ピン詳細モーダル中、カメラボタンの下に表示) */
  #float-home-btn {
    position: fixed;
    bottom: calc(4px + var(--safe-bottom));
    right: 20px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: rgba(40,40,55,0.92);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 150;
    display: none;
    align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s;
    backdrop-filter: blur(8px);
  }
  #float-home-btn:active { transform: scale(0.9); background: var(--accent); }

  .btn-camera {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 14px;
    font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  /* BURST MODE TOGGLE */
  .burst-toggle {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px 10px; font-size: 12px;
    color: var(--text2); cursor: pointer; flex-shrink: 0;
    transition: all 0.15s; user-select: none;
  }
  .burst-toggle.active {
    background: rgba(233,69,96,0.15);
    border-color: var(--accent); color: var(--accent);
  }
  .burst-toggle .burst-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.15s;
  }
  .burst-toggle.active .burst-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .burst-banner {
    background: rgba(233,69,96,0.15); border: 1px solid var(--accent);
    border-radius: 8px; padding: 8px 12px; font-size: 12px;
    color: var(--accent); margin-bottom: 12px;
    display: none; align-items: center; gap: 8px;
  }
  .burst-banner.show { display: flex; }
  .burst-banner .burst-count { font-weight: 700; }

  /* CROP BUTTONS */
  .crop-btn {
    flex:1; padding:8px 4px; border-radius:8px; font-size:13px; font-weight:600;
    background:var(--surface2); border:1px solid rgba(255,255,255,0.1);
    color:var(--text2); cursor:pointer; transition:all 0.15s;
  }
  .crop-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* EXPORT MENU */
  .export-menu-btn {
    width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); padding: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; color: var(--text);
    margin-bottom: 10px; text-align: left; transition: border-color 0.15s;
  }
  .export-menu-btn:active { border-color: var(--accent); background: var(--accent2); }
  .export-icon { font-size: 28px; flex-shrink: 0; }
  .export-btn-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .export-btn-sub { font-size: 12px; color: var(--text2); }

  /* ASPECT RATIO BUTTONS */
  .aspect-btn {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); padding: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; color: var(--text);
    transition: border-color 0.15s;
  }
  .aspect-btn:active { border-color: var(--accent); background: var(--accent2); }
  .aspect-preview {
    width: 80px; background: var(--surface); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .aspect-preview span { font-size: 12px; font-weight: 700; color: var(--accent); }
  .aspect-label { font-size: 15px; font-weight: 500; }
  .zoom-hint {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.6);
    font-size: 11px; padding: 4px 10px; border-radius: 20px; pointer-events: none;
    transition: opacity 0.5s; white-space: nowrap;
  }

  /* Summary bar */
  #summary-bar {
    background: var(--surface2); padding: 5px 14px;
    display: flex; gap: 12px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .summary-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .summary-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ===== LANDSCAPE COMPACT (横画面: ヘッダー類を圧縮して図面エリアを広げる) ===== */
  /* 横画面全般: 中程度の圧縮 (iPad横画面など) */
  @media (orientation: landscape) {
    header { padding: 4px 14px; }
    header h1 { font-size: 13px; }
    .header-btn { padding: 4px 10px; font-size: 12px; }

    #folder-tabs { padding: 3px 14px; gap: 5px; }
    .folder-tab { padding: 3px 10px; font-size: 11px; }
    #floor-tabs { padding: 3px 14px; gap: 6px; }
    .floor-tab { padding: 3px 11px; font-size: 11px; }

    #summary-bar { padding: 3px 14px; gap: 12px; }
    .summary-item { font-size: 10px; }
    .summary-dot { width: 6px; height: 6px; }

    #toolbar {
      padding: 4px 14px;
      padding-bottom: calc(4px + var(--safe-bottom));
      gap: 8px;
    }
    .tool-btn {
      flex-direction: row; gap: 8px;
      padding: 6px 6px; font-size: 12px;
    }
    .tool-btn .icon { font-size: 16px; }
  }

  /* 横画面かつ縦が小さい (iPhone横画面) : さらに圧縮 */
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 2px 12px; }
    header h1 { font-size: 12px; }
    .header-btn { padding: 2px 8px; font-size: 11px; }

    #folder-tabs { padding: 2px 12px; gap: 4px; }
    .folder-tab { padding: 2px 8px; font-size: 10px; }
    #floor-tabs { padding: 2px 12px; gap: 5px; }
    .floor-tab { padding: 2px 9px; font-size: 11px; }

    #summary-bar { padding: 2px 12px; gap: 10px; }
    .summary-item { font-size: 10px; gap: 3px; }
    .summary-dot { width: 5px; height: 5px; }

    #toolbar {
      padding: 2px 12px;
      padding-bottom: calc(2px + var(--safe-bottom));
      gap: 6px;
    }
    .tool-btn {
      padding: 4px 4px; font-size: 10px;
    }
    .tool-btn .icon { font-size: 14px; }

    .zoom-hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📐 現場検査</h1>
    <button class="header-btn" onclick="showAddMenu()">＋ 追加</button>
  </header>

  <!-- フォルダ行 -->
  <div id="folder-tabs"></div>
  <!-- 図面行 -->
  <div id="floor-tabs"></div>

  <div id="summary-bar">
    <div class="summary-item"><div class="summary-dot" style="background:var(--accent)"></div><span id="sum-total">0件</span></div>
    <div class="summary-item"><div class="summary-dot" style="background:var(--ok)"></div><span id="sum-ok">OK: 0</span></div>
    <div class="summary-item"><div class="summary-dot" style="background:var(--ng)"></div><span id="sum-ng">NG: 0</span></div>
    <div class="summary-item"><div class="summary-dot" style="background:var(--check)"></div><span id="sum-check">確認: 0</span></div>
  </div>

  <div id="main">
    <div id="plan-view">
      <div id="plan-canvas-wrap">
        <img id="plan-img" src="" alt="図面">
        <div id="pins-layer"></div>
      </div>
      <div class="no-plan" id="no-plan-msg">
        <div class="no-plan-icon">📋</div>
        <p id="no-plan-text">まずフォルダを追加してください</p>
        <button class="upload-plan-btn" id="no-plan-btn" onclick="showAddMenu()" ontouchend="showAddMenu()">＋ 追加する</button>
      </div>
      <div class="zoom-hint" id="zoom-hint">1本指でピン追加 / 2本指で移動・拡大</div>
    </div>
    <div id="list-view"></div>
  </div>

  <div id="toolbar">
    <button class="tool-btn" id="btn-pin-mode" onclick="setMode('pin')">
      <span class="icon">📍</span><span>ピン追加</span>
    </button>
    <button class="tool-btn active" id="btn-move-mode" onclick="setMode('move')">
      <span class="icon">✋</span><span>移動</span>
    </button>
    <button class="tool-btn" id="btn-list-mode" onclick="setMode('list')">
      <span class="icon">📋</span><span>一覧</span>
    </button>
    <button class="tool-btn" id="btn-export" onclick="openModal('export-modal')">
      <span class="icon">📤</span><span>エクスポート</span>
    </button>
  </div>
</div>

<!-- Add Menu Modal -->
<div class="modal-overlay" id="add-menu-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">＋ 追加</div>
    <button class="export-menu-btn" ontouchend="closeModal('add-menu-modal');showFolderModal()" onclick="closeModal('add-menu-modal');showFolderModal()">
      <span class="export-icon">📁</span>
      <div><div class="export-btn-title">フォルダを追加</div><div class="export-btn-sub">図面をまとめるフォルダを作成</div></div>
    </button>
    <button class="export-menu-btn" ontouchend="closeModal('add-menu-modal');showFloorModal()" onclick="closeModal('add-menu-modal');showFloorModal()">
      <span class="export-icon">📋</span>
      <div><div class="export-btn-title">図面を追加</div><div class="export-btn-sub">PDF/画像をアップロード</div></div>
    </button>
    <button class="btn-danger" ontouchend="closeModal('add-menu-modal')" onclick="closeModal('add-menu-modal')">キャンセル</button>
  </div>
</div>

<!-- Folder Modal -->
<div class="modal-overlay" id="folder-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📁 フォルダを追加</div>
    <input class="input-field" type="text" autocomplete="off" id="folder-name-input" placeholder="フォルダ名（例：A棟、1工区）">
    <button class="btn-primary" ontouchend="saveFolder()" onclick="saveFolder()">追加する</button>
    <button class="btn-danger" ontouchend="closeModal('folder-modal')" onclick="closeModal('folder-modal')">キャンセル</button>
  </div>
</div>

<!-- Rename Folder Modal -->
<div class="modal-overlay" id="rename-folder-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ フォルダ名を変更</div>
    <input class="input-field" type="text" autocomplete="off" id="rename-folder-input" placeholder="フォルダ名">
    <button class="btn-primary" ontouchend="saveRenameFolder()" onclick="saveRenameFolder()">変更する</button>
    <button class="btn-danger" ontouchend="closeModal('rename-folder-modal')" onclick="closeModal('rename-folder-modal')">キャンセル</button>
  </div>
</div>

<!-- Rename Floor Modal -->
<div class="modal-overlay" id="rename-floor-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 図面名を変更</div>
    <input class="input-field" type="text" autocomplete="off" id="rename-floor-input" placeholder="図面名">
    <button class="btn-primary" ontouchend="saveRenameFloor()" onclick="saveRenameFloor()">変更する</button>
    <button class="btn-danger" onclick="closeModal('rename-floor-modal')">キャンセル</button>
  </div>
</div>

<!-- Floor Modal -->
<div class="modal-overlay" id="floor-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="floor-modal-title">図面を追加</div>
    <input class="input-field" type="text" autocomplete="off" id="floor-name-input" placeholder="図面名（例：1F 平面図）">
    <select class="input-field" id="floor-folder-select" style="cursor:pointer"></select>
    <button class="btn-primary" style="margin-top:0;margin-bottom:12px" id="floor-file-btn">
      📁 画像/PDFを選択
    </button>
    <div id="floor-preview-wrap" style="display:none; margin-bottom:12px">
      <img id="floor-preview" style="width:100%; border-radius:8px; max-height:200px; object-fit:contain; background:#111">
    </div>
    <button class="btn-primary" id="floor-modal-save-btn">追加する</button>
    <button class="btn-danger" onclick="closeModal('floor-modal')">キャンセル</button>
  </div>
</div>

<!-- Pin Detail Modal -->
<div class="modal-overlay" id="pin-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="display:flex; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap;">
      <div class="modal-title" id="pin-modal-title" style="margin-bottom:0; flex:1; min-width:0;">📍 ピン #1</div>
      <div class="burst-toggle" id="select-toggle" onclick="togglePhotoSelectMode()" style="display:none">
        <div class="burst-dot"></div>
        <span>選択</span>
      </div>
      <div class="burst-toggle" id="burst-toggle" onclick="toggleBurstMode()">
        <div class="burst-dot"></div>
        <span>連写</span>
      </div>
      <button class="btn-camera" ontouchend="openAspectModal()" onclick="openAspectModal()">📷 撮影</button>
    </div>
    <div class="burst-banner" id="burst-banner">
      <span>📸</span>
      <div style="flex:1">連写モード中 <span class="burst-count" id="burst-count">(0枚)</span></div>
      <button onclick="stopBurstMode()" style="background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer;">停止</button>
    </div>
    <div class="status-row">
      <div class="status-chip ok" id="chip-ok" onclick="setPinStatus('ok')">✅ OK</div>
      <div class="status-chip ng" id="chip-ng" onclick="setPinStatus('ng')">❌ NG</div>
      <div class="status-chip check" id="chip-check" onclick="setPinStatus('check')">⚠️ 確認</div>
    </div>
    <!-- ピン色 -->
    <div style="margin-bottom:12px">
      <div style="font-size:12px; color:var(--text2); margin-bottom:6px;">ピンの色</div>
      <div id="pin-color-row" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>
    <div id="pin-photos" class="pin-photos"></div>
    <textarea class="memo" id="pin-memo" placeholder="メモを入力..." rows="3"></textarea>
    <div style="font-size:12px; color:var(--text2); margin-top:6px" id="pin-date"></div>
    <button class="btn-primary" onclick="savePinDetail()">保存</button>
    <button class="btn-zip" id="btn-pin-save-photos" onclick="savePinPhotosToLibrary()">📱 写真をカメラロールに保存</button>
    <button class="btn-zip" id="btn-pin-zip" onclick="exportPinZip()">🗂️ この写真をZIPでダウンロード</button>
    <div id="pin-zip-progress" style="display:none; margin-top:8px">
      <div style="font-size:12px; color:var(--text2); margin-bottom:4px" id="pin-zip-text">作成中...</div>
      <div style="height:4px; background:var(--surface2); border-radius:2px">
        <div id="pin-zip-bar" style="height:100%; background:var(--accent); border-radius:2px; width:0%; transition:width 0.2s"></div>
      </div>
    </div>
    <button class="btn-danger" onclick="deletePin()">このピンを削除</button>
  </div>
</div>

<!-- Floating Camera Button -->
<button id="float-camera-btn" ontouchend="openAspectModal()" onclick="openAspectModal()">📷</button>

<!-- Floating Home Button (back to floor view) -->
<button id="float-home-btn" onclick="goBackToFloor()" title="図面に戻る">🏠</button>

<!-- Pin Modal Scroll Jump Buttons -->
<div id="pin-jump-buttons">
  <button class="pin-jump-btn" onclick="jumpPinModal('top')" title="最上部へ">⤒</button>
  <button class="pin-jump-btn" onclick="jumpPinModal('bottom')" title="最下部へ">⤓</button>
</div>

<!-- Photo Select Mode Action Bar -->
<div id="select-action-bar">
  <span class="sel-count" id="sel-count">0 枚選択</span>
  <button onclick="selectAllPhotos()">全選択</button>
  <button class="sel-save" onclick="saveSelectedPhotos()" id="sel-save-btn">📱 保存</button>
  <button class="sel-delete" onclick="deleteSelectedPhotos()" id="sel-delete-btn">🗑️ 削除</button>
  <button onclick="exitPhotoSelectMode()">×</button>
</div>

<!-- Photo Viewer -->
<div id="photo-viewer">
  <div id="viewer-toolbar">
    <div id="viewer-counter">1 / 1</div>
    <div style="flex:1"></div>
    <button class="viewer-action-btn" onclick="saveCurrentViewerPhoto()" title="保存">📱</button>
    <button class="viewer-action-btn viewer-del-btn" onclick="deleteCurrentViewerPhoto()" title="削除">🗑️</button>
    <button class="viewer-action-btn" onclick="closePhotoViewer()" title="閉じる">✕</button>
  </div>
  <div id="viewer-stage">
    <img id="viewer-img" src="" alt="">
  </div>
  <div id="viewer-nav-prev" onclick="navigateViewer(-1)">‹</div>
  <div id="viewer-nav-next" onclick="navigateViewer(1)">›</div>
  <div id="viewer-hint">ピンチで拡大 / ダブルタップでズーム</div>
</div>

<!-- Export Modal -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📤 エクスポート</div>
    <button class="export-menu-btn" onclick="exportReport()">
      <span class="export-icon">📄</span>
      <div>
        <div class="export-btn-title">テキストレポート</div>
        <div class="export-btn-sub">検査結果をテキストファイルで出力</div>
      </div>
    </button>
    <button class="export-menu-btn" onclick="exportZip()">
      <span class="export-icon">🗂️</span>
      <div>
        <div class="export-btn-title">写真をZIPでダウンロード</div>
        <div class="export-btn-sub">ピンごとのフォルダにまとめて出力</div>
      </div>
    </button>
    <button class="export-menu-btn" onclick="exportZipAll()">
      <span class="export-icon">📦</span>
      <div>
        <div class="export-btn-title">全図面の写真をZIPでダウンロード</div>
        <div class="export-btn-sub">すべての図面・ピンをまとめて出力</div>
      </div>
    </button>
    <div style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.08); font-size:12px; color:var(--text2); margin-bottom:8px">💾 バックアップ・復元</div>
    <button class="export-menu-btn" onclick="exportBackup()">
      <span class="export-icon">💾</span>
      <div>
        <div class="export-btn-title">バックアップを書き出す</div>
        <div class="export-btn-sub">全データを1つのJSONファイルで保存</div>
      </div>
    </button>
    <button class="export-menu-btn" onclick="document.getElementById('backup-file-input').click()">
      <span class="export-icon">📥</span>
      <div>
        <div class="export-btn-title">バックアップから復元</div>
        <div class="export-btn-sub">JSONファイルを読み込んで取り込み</div>
      </div>
    </button>
    <div id="export-progress" style="display:none; margin-top:12px">
      <div style="font-size:13px; color:var(--text2); margin-bottom:6px" id="export-progress-text">ZIPを作成中...</div>
      <div style="height:4px; background:var(--surface2); border-radius:2px">
        <div id="export-progress-bar" style="height:100%; background:var(--accent); border-radius:2px; width:0%; transition:width 0.2s"></div>
      </div>
    </div>
    <button class="btn-danger" onclick="closeModal('export-modal')">キャンセル</button>
    <div style="margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.1)">
      <button class="btn-danger" onclick="resetAllData()" style="opacity:0.6; font-size:13px;">🗑️ 全データをリセット（初期化）</button>
    </div>
  </div>
</div>

<!-- Aspect Ratio Modal → 削除してカメラ直起動に変更 -->

<!-- Hidden file input for backup import -->
<input type="file" id="backup-file-input" accept=".json,application/json" style="display:none" onchange="handleBackupFile(this)">

<!-- Import Confirm Modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📥 バックアップから復元</div>
    <div id="import-summary" style="background:var(--surface2); border-radius:var(--radius); padding:12px; margin-bottom:14px; font-size:13px; color:var(--text2); line-height:1.6;"></div>
    <div style="font-size:12px; color:var(--text2); margin-bottom:6px;">取り込み方法</div>
    <button class="export-menu-btn" onclick="confirmImport('merge')">
      <span class="export-icon">➕</span>
      <div>
        <div class="export-btn-title">マージ（追加）</div>
        <div class="export-btn-sub">既存データを残したまま追加する</div>
      </div>
    </button>
    <button class="export-menu-btn" onclick="confirmImport('replace')">
      <span class="export-icon">♻️</span>
      <div>

        <div class="export-btn-sub" style="color:var(--ng)">既存データを全削除して置き換え</div>

<script>
// ========== STATE ==========
let state = {
  folders: [], // [{id, name, order}]
  floors: [],  // [{id, name, folderId, order, imageData, pins:[]}]
  currentFolderId: null,
  currentFloorId: null,
  mode: 'move',
  editingPinId: null,
  pendingPhotoForPin: null,
  pendingAspect: '4:3',
};

let transform = { x: 0, y: 0, scale: 1 };
let gesture = { fingers: 0, startDist: 0, startScale: 1, startX: 0, startY: 0, startTX: 0, startTY: 0, midX: 0, midY: 0, moved: false, startTime: 0 };

const DB_NAME = 'inspection_app_v2';
const DB_VERSION = 1;
const STORE_FLOORS = 'floors';
const STORE_FOLDERS = 'folders';
const LS_KEY = 'inspection_app_v3';

let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_FLOORS)) {
        db.createObjectStore(STORE_FLOORS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORE_FOLDERS)) {
        db.createObjectStore(STORE_FOLDERS, { keyPath: 'id' });
      }

    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e.target.error);
  });
}

async function save() {
  try {
    const db = await openDB();

    // Save folders
    const ftx = db.transaction(STORE_FOLDERS, 'readwrite');
    const fstore = ftx.objectStore(STORE_FOLDERS);
    for (const folder of state.folders) fstore.put(folder);
    const fkeys = await new Promise((res,rej) => { const r=fstore.getAllKeys(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    const fids = new Set(state.folders.map(f=>f.id));
    for (const k of fkeys) if (!fids.has(k)) fstore.delete(k);
    await new Promise((res,rej) => { ftx.oncomplete=res; ftx.onerror=()=>rej(ftx.error); });

    // Save floors
    const tx = db.transaction(STORE_FLOORS, 'readwrite');
    const store = tx.objectStore(STORE_FLOORS);
    for (const floor of state.floors) store.put(floor);
    const allKeys = await new Promise((res,rej) => { const r=store.getAllKeys(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    const currentIds = new Set(state.floors.map(f=>f.id));
    for (const key of allKeys) if (!currentIds.has(key)) store.delete(key);
    await new Promise((res,rej) => { tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  } catch(e) {
    console.error('Save error:', e);
    alert('保存に失敗しました: ' + e.message);
  }
}

async function load() {
  try {
    const db = await openDB();

    // Load folders
    const ftx = db.transaction(STORE_FOLDERS, 'readonly');
    const folders = await new Promise((res,rej) => { const r=ftx.objectStore(STORE_FOLDERS).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    state.folders = folders || [];

    // Load floors
    const tx = db.transaction(STORE_FLOORS, 'readonly');
    const floors = await new Promise((res,rej) => { const r=tx.objectStore(STORE_FLOORS).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

    if (floors && floors.length > 0) {
      state.floors = floors;
      // 古いデータにorderがなければ付与
      state.floors.forEach((f,i) => { if (f.order===undefined) f.order=i; });
      state.folders.forEach((f,i) => { if (f.order===undefined) f.order=i; });

      return;
    }

    // localStorageから移行
    const lsData = localStorage.getItem(LS_KEY);
    if (lsData) {
      const parsed = JSON.parse(lsData);
      if (parsed && parsed.length > 0) {
        const def = { id: 'folder_default', name: 'メイン', order: 0 };
        state.folders = [def];
        state.floors = parsed.map((f,i) => ({ ...f, folderId: def.id, order: i }));
        await save();
        localStorage.removeItem(LS_KEY);
      }
    }

  } catch(e) {
    console.error('Load error:', e);
    try {
      const lsData = localStorage.getItem(LS_KEY);
      if (lsData) state.floors = JSON.parse(lsData);
    } catch(e2) {}
  }
}

async function init() {
  await load();
  fixOrphanedFloors();
  await save(); // 修正したfolderIdを保存
  if (state.folders.length > 0) {
    state.currentFolderId = state.folders.sort((a,b)=>a.order-b.order)[0].id;
  }
  renderFolderTabs();
  renderFloorTabs();
  const floorsInFolder = getFloorsInFolder(state.currentFolderId);
  if (floorsInFolder.length > 0) {
    selectFloor(floorsInFolder.sort((a,b)=>(a.order||0)-(b.order||0))[0].id);
  } else {
    showNoPlan();
  }
  setupGestures();
  setTimeout(() => {
    document.getElementById('zoom-hint').style.opacity = '0';
  }, 3000);
  loadBurstPref();

}

// ========== FOLDERS ==========
function getFloorsInFolder(folderId) {
  return state.floors.filter(f => f.folderId === folderId);
}

function fixOrphanedFloors() {
  // folderIdがない、またはフォルダが存在しない図面をデフォルトフォルダに割り当て
  const folderIds = new Set(state.folders.map(f => f.id));
  const defaultId = state.folders.length > 0 ? state.folders.sort((a,b)=>a.order-b.order)[0].id : null;
  if (!defaultId) return;
  state.floors.forEach(f => {
    if (!f.folderId || !folderIds.has(f.folderId)) {
      f.folderId = defaultId;
    }
  });
}

function showAddMenu() { openModal('add-menu-modal'); }

function showFolderModal() {
  document.getElementById('folder-name-input').value = '';
  openModal('folder-modal');
}

function saveFolder() {
  const name = document.getElementById('folder-name-input').value.trim();
  if (!name) { alert('フォルダ名を入力してください'); return; }
  const folder = { id: 'folder_' + Date.now(), name, order: state.folders.length };
  state.folders.push(folder);
  save();
  state.currentFolderId = folder.id;
  renderFolderTabs();
  renderFloorTabs();
  closeModal('folder-modal');
}

function selectFolder(id) {
  state.currentFolderId = id;
  const floors = getFloorsInFolder(id).sort((a,b)=>(a.order||0)-(b.order||0));
  renderFolderTabs();
  renderFloorTabs();
  if (floors.length > 0) {
    selectFloor(floors[0].id);
  } else {
    state.currentFloorId = null;
    showNoPlan();
    updateSummary();
  }
}

function renderFolderTabs() {
  const tabs = document.getElementById('folder-tabs');
  tabs.innerHTML = '';
  const sorted = [...state.folders].sort((a,b)=>a.order-b.order);

  sorted.forEach(folder => {
    const tab = document.createElement('div');
    tab.className = 'folder-tab' + (folder.id === state.currentFolderId ? ' active' : '');
    tab.dataset.folderId = folder.id;

    const label = document.createElement('span');
    label.textContent = '📁 ' + folder.name;
    label.style.cursor = 'pointer';

    label.addEventListener('click', () => selectFolder(folder.id));
    label.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); selectFolder(folder.id); });

    const delBtn = document.createElement('span');
    delBtn.className = 'folder-del';
    delBtn.textContent = '✕';
    delBtn.style.cursor = 'pointer';
    delBtn.addEventListener('click', e => { e.stopPropagation(); confirmDeleteFolder(folder.id); });
    delBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); confirmDeleteFolder(folder.id); });

    tab.appendChild(label);
    tab.appendChild(delBtn);
    tabs.appendChild(tab);

    setupFolderDrag(tab, folder);
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'folder-tab add-btn';
  addBtn.textContent = '＋ フォルダ';
  addBtn.onclick = showFolderModal;
  tabs.appendChild(addBtn);
}

function setupFolderDrag(el, folder) {
  let longTimer = null, dragging = false, startX = 0, clone = null;
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    longTimer = setTimeout(() => {
      dragging = true;
      el.style.opacity = '0.5';
    }, 600);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!dragging) { clearTimeout(longTimer); return; }
    const x = e.touches[0].clientX;
    const tabs = document.getElementById('folder-tabs');
    const children = [...tabs.querySelectorAll('.folder-tab:not(.add-btn)')];
    children.forEach(c => {
      const rect = c.getBoundingClientRect();
      if (x > rect.left && x < rect.right && c !== el) {
        const otherFolder = state.folders.find(f => f.id === c.dataset.folderId);
        if (otherFolder) {
          const tmp = folder.order; folder.order = otherFolder.order; otherFolder.order = tmp;
          renderFolderTabs();
        }
      }
    });
  }, { passive: true });
  el.addEventListener('touchend', () => {
    clearTimeout(longTimer);
    if (dragging) { dragging = false; el.style.opacity = ''; save(); }
  });
}

function renameFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  document.getElementById('rename-folder-input').value = folder.name;
  window._renamingFolderId = id;
  openModal('rename-folder-modal');
  setTimeout(() => document.getElementById('rename-folder-input').focus(), 300);
}

function saveRenameFolder() {
  const folder = state.folders.find(f => f.id === window._renamingFolderId);
  if (!folder) return;
  const name = document.getElementById('rename-folder-input').value.trim();
  if (!name) return;
  folder.name = name;
  save();
  renderFolderTabs();
  closeModal('rename-folder-modal');
}

function confirmDeleteFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  const floorCount = getFloorsInFolder(id).length;
  if (!confirm(`「${folder.name}」を削除しますか？\n中の図面${floorCount}件もすべて削除されます。`)) return;
  state.floors = state.floors.filter(f => f.folderId !== id);
  state.folders = state.folders.filter(f => f.id !== id);
  save();
  if (state.folders.length > 0) selectFolder(state.folders[0].id);
  else { state.currentFolderId = null; state.currentFloorId = null; renderFolderTabs(); renderFloorTabs(); showNoPlan(); }
}

// ========== FLOORS ==========
function showFloorModal() {
  document.getElementById('floor-name-input').value = '';
  document.getElementById('floor-preview-wrap').style.display = 'none';
  document.getElementById('floor-file-input').value = '';
  document.getElementById('floor-modal-title').textContent = '図面を追加';
  window._pendingFloorDataUrl = null;
  window._replacingFloorId = null;
  // ファイル選択ボタン
  const fileBtn = document.getElementById('floor-file-btn');
  fileBtn.onclick = () => document.getElementById('floor-file-input').click();
  // 保存ボタン
  const saveBtn = document.getElementById('floor-modal-save-btn');
  saveBtn.textContent = '追加する';
  saveBtn.onclick = saveFloor;
  // フォルダ選択肢
  const sel = document.getElementById('floor-folder-select');
  sel.innerHTML = state.folders.map(f => `<option value="${f.id}" ${f.id===state.currentFolderId?'selected':''}>${f.name}</option>`).join('');
  openModal('floor-modal');
}

function showReplaceFloorModal(floorId) {
  const floor = getFloor(floorId);
  if (!floor) return;
  document.getElementById('floor-name-input').value = floor.name;
  document.getElementById('floor-preview-wrap').style.display = 'none';
  document.getElementById('floor-file-input').value = '';
  document.getElementById('floor-modal-title').textContent = '図面を差し替え・名前変更';
  window._pendingFloorDataUrl = null;
  window._replacingFloorId = floorId;
  // ファイル選択ボタン
  const fileBtn = document.getElementById('floor-file-btn');
  fileBtn.onclick = () => document.getElementById('floor-file-input').click();
  // 保存ボタン
  const saveBtn = document.getElementById('floor-modal-save-btn');
  saveBtn.textContent = '変更する';
  saveBtn.onclick = () => replaceFloor(floorId);
  // フォルダ選択肢
  const sel = document.getElementById('floor-folder-select');
  sel.innerHTML = state.folders.map(f => `<option value="${f.id}" ${f.id===floor.folderId?'selected':''}>${f.name}</option>`).join('');
  openModal('floor-modal');
}

function replaceFloor(floorId) {
  const floor = getFloor(floorId);
  if (!floor) return;
  const name = document.getElementById('floor-name-input').value.trim() || floor.name;
  const folderId = document.getElementById('floor-folder-select').value;
  floor.name = name;
  floor.folderId = folderId;
  if (window._pendingFloorDataUrl) {
    floor.imageData = window._pendingFloorDataUrl; // 画像差し替え（ピン・写真はそのまま）
  }
  save();
  renderFolderTabs();
  renderFloorTabs();
  if (state.currentFloorId === floorId) loadFloorImage(floor);
  closeModal('floor-modal');
}

function saveFloor() {
  const name = document.getElementById('floor-name-input').value.trim() || '図面 ' + (state.floors.length + 1);
  const folderId = document.getElementById('floor-folder-select').value || state.currentFolderId;
  if (!window._pendingFloorDataUrl) {
    alert('図面ファイルが読み込まれていません。\nPDFはEdgeでブロックされる場合があります。\nJPGまたはPNG画像をお使いください。');
    return;
  }
  if (!folderId) {
    alert('フォルダが選択されていません。');
    return;
  }
  const floor = {
    id: 'f_' + Date.now(),
    name,
    folderId,
    order: getFloorsInFolder(folderId).length,
    imageData: window._pendingFloorDataUrl,
    pins: [],
    createdAt: new Date().toISOString(),
  };
  state.floors.push(floor);
  save();
  state.currentFolderId = folderId;
  renderFolderTabs();
  renderFloorTabs();
  selectFloor(floor.id);
  closeModal('floor-modal');
}

function selectFloor(id) {
  state.currentFloorId = id;
  const floor = getFloor(id);
  renderFloorTabs();
  if (floor) loadFloorImage(floor);
  if (state.mode === 'list') renderListView();
  updateSummary();
}

function getFloor(id) {
  return state.floors.find(f => f.id === id);
}

function loadFloorImage(floor) {
  const img = document.getElementById('plan-img');
  const noPlan = document.getElementById('no-plan-msg');
  img.onload = function() {
    noPlan.style.display = 'none';
    const view = document.getElementById('plan-view');
    const vw = view.offsetWidth, vh = view.offsetHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.min(vw / iw, vh / ih, 1);
    transform = { x: (vw - iw * scale) / 2, y: (vh - ih * scale) / 2, scale };
    applyTransform();
    renderPins();
  };
  img.src = floor.imageData;
  noPlan.style.display = 'none';
}

function showNoPlan() {
  document.getElementById('no-plan-msg').style.display = 'flex';
  document.getElementById('plan-img').src = '';
  document.getElementById('pins-layer').innerHTML = '';
  const txt = document.getElementById('no-plan-text');
  const btn = document.getElementById('no-plan-btn');
  if (state.folders.length === 0) {
    if (txt) txt.textContent = 'まずフォルダを追加してください';
    if (btn) { btn.textContent = '＋ フォルダを追加'; btn.onclick = showFolderModal; }
  } else {
    if (txt) txt.textContent = '図面がありません';
    if (btn) { btn.textContent = '＋ 図面を追加する'; btn.onclick = showFloorModal; }
  }
}

function confirmDeleteFloor(id) {
  const floor = getFloor(id);
  if (!floor) return;
  const pinCount = floor.pins.length;
  const photoCount = floor.pins.reduce((s, p) => s + p.photos.length, 0);
  if (!confirm(`「${floor.name}」を削除しますか？\nピン${pinCount}件・写真${photoCount}枚がすべて削除されます。`)) return;
  state.floors = state.floors.filter(f => f.id !== id);
  save();
  const remaining = getFloorsInFolder(state.currentFolderId).sort((a,b)=>a.order-b.order);
  if (remaining.length > 0) selectFloor(remaining[0].id);
  else { state.currentFloorId = null; showNoPlan(); renderFloorTabs(); updateSummary(); }
}

function renderFloorTabs() {
  const tabs = document.getElementById('floor-tabs');
  tabs.innerHTML = '';
  const floors = getFloorsInFolder(state.currentFolderId).sort((a,b)=>a.order-b.order);

  floors.forEach(f => {
    const tab = document.createElement('div');
    tab.className = 'floor-tab' + (f.id === state.currentFloorId ? ' active' : '');
    tab.style.display = 'flex'; tab.style.alignItems = 'center'; tab.style.gap = '6px';
    tab.dataset.floorId = f.id;

    const label = document.createElement('span');
    label.textContent = f.name;
    label.style.cursor = 'pointer';
    label.addEventListener('click', () => selectFloor(f.id));
    label.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); selectFloor(f.id); });

    const replaceBtn = document.createElement('span');
    replaceBtn.textContent = '🔄';
    replaceBtn.title = '図面を差し替え・名前変更';
    replaceBtn.style.cssText = 'font-size:11px;cursor:pointer;opacity:0.6;';
    replaceBtn.onclick = e => { e.stopPropagation(); showReplaceFloorModal(f.id); };
    replaceBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); showReplaceFloorModal(f.id); });

    const delBtn = document.createElement('span');
    delBtn.textContent = '✕';
    delBtn.style.cssText = 'font-size:11px;opacity:0.5;cursor:pointer;padding:2px 4px;border-radius:4px;';
    delBtn.onclick = e => { e.stopPropagation(); confirmDeleteFloor(f.id); };
    delBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); confirmDeleteFloor(f.id); });

    tab.appendChild(label);
    tab.appendChild(replaceBtn);
    tab.appendChild(delBtn);
    tabs.appendChild(tab);

    setupFloorDrag(tab, f);
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'floor-tab add-btn';
  addBtn.textContent = '＋ 図面追加';
  addBtn.onclick = showFloorModal;
  addBtn.addEventListener('touchend', e => { e.preventDefault(); showFloorModal(); });
  tabs.appendChild(addBtn);
}

function setupFloorDrag(el, floor) {
  let longTimer = null, dragging = false;
  el.addEventListener('touchstart', e => {
    longTimer = setTimeout(() => { dragging = true; el.style.opacity = '0.5'; }, 600);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!dragging) { clearTimeout(longTimer); return; }
    const x = e.touches[0].clientX;
    const tabs = document.getElementById('floor-tabs');
    const children = [...tabs.querySelectorAll('.floor-tab:not(.add-btn)')];
    children.forEach(c => {
      const rect = c.getBoundingClientRect();
      if (x > rect.left && x < rect.right && c !== el) {
        const otherFloor = state.floors.find(f => f.id === c.dataset.floorId);
        if (otherFloor) {
          const tmp = floor.order; floor.order = otherFloor.order; otherFloor.order = tmp;
          renderFloorTabs();
        }
      }
    });
  }, { passive: true });
  el.addEventListener('touchend', () => {
    clearTimeout(longTimer);
    if (dragging) { dragging = false; el.style.opacity = ''; save(); }
  });
}
function handleFloorFile(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.type === 'application/pdf') {
    // PDFをObjectURLでiframe表示してCanvasにキャプチャ
    renderPDFToImage(file);
  } else {
    const reader = new FileReader();
    reader.onload = function(e) {
      window._pendingFloorDataUrl = e.target.result;
      const preview = document.getElementById('floor-preview');
      const wrap = document.getElementById('floor-preview-wrap');
      if (preview) preview.src = e.target.result;
      if (wrap) wrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

function renderPDFToImage(file) {
  const btn = document.getElementById('floor-file-btn');
  const wrap = document.getElementById('floor-preview-wrap');
  const preview = document.getElementById('floor-preview');
  btn.textContent = '⏳ PDF読み込み中...';
  btn.disabled = true;

  const tryPdfJs = (src, workerSrc) => {
    return new Promise((resolve, reject) => {
      if (typeof pdfjsLib !== 'undefined') {
        resolve(pdfjsLib);
        return;
      }
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => {
        if (typeof pdfjsLib !== 'undefined') {
          pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;
          resolve(pdfjsLib);
        } else reject(new Error('pdfjsLib not found'));
      };
      s.onerror = () => reject(new Error('Script load failed: ' + src));
      document.head.appendChild(s);
    });
  };

  const cdnList = [
    ['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
     'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
     'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
    ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
     'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  ];

  const tryNext = async (index) => {
    if (index >= cdnList.length) {
      btn.textContent = '📁 画像/PDFを選択';
      btn.disabled = false;
      alert('PDFの読み込みに失敗しました。\nネットワーク環境を確認するか、JPG/PNG画像をお試しください。');
      return;
    }
    try {
      const [src, workerSrc] = cdnList[index];
      const lib = await tryPdfJs(src, workerSrc);
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await lib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      window._pendingFloorDataUrl = dataUrl;
      if (preview) { preview.src = dataUrl; }
      if (wrap) wrap.style.display = 'block';
      btn.textContent = '✅ PDF読み込み完了（再選択する場合はタップ）';
      btn.disabled = false;
      btn.onclick = () => document.getElementById('floor-file-input').click();
    } catch(e) {
      console.warn('PDF CDN failed:', cdnList[index][0], e.message);
      tryNext(index + 1);
    }
  };

  tryNext(0);
}





// ========== PINS ==========
function createPin(xPct, yPct) {
  const floor = getFloor(state.currentFloorId);
  if (!floor) return;
  const pin = {
    id: 'p_' + Date.now(),
    x: xPct, y: yPct,
    status: 'none',
    photos: [],
    memo: '',
    createdAt: new Date().toISOString(),
    num: floor.pins.length + 1,
  };
  floor.pins.push(pin);
  save();
  renderPins();
  updateSummary();
  // Auto-open detail
  openPinDetail(pin.id);
}

const PIN_COLORS = [
  '#e94560', '#2ecc71', '#e74c3c', '#3498db', '#f39c12',
  '#9b59b6', '#1abc9c', '#e67e22', '#ffffff', '#f1c40f'
];

function renderPins() {
  const floor = getFloor(state.currentFloorId);
  if (!floor) return;
  const layer = document.getElementById('pins-layer');
  const img = document.getElementById('plan-img');
  layer.innerHTML = '';
  layer.style.position = 'absolute';
  layer.style.left = '0'; layer.style.top = '0';
  layer.style.width = img.naturalWidth + 'px';
  layer.style.height = img.naturalHeight + 'px';

  floor.pins.forEach(pin => {
    const el = document.createElement('div');
    el.className = 'pin status-' + pin.status;
    el.style.left = (pin.x * img.naturalWidth) + 'px';
    el.style.top = (pin.y * img.naturalHeight) + 'px';
    const pinColor = pin.color || null;
    let badge = '';
    if (pin.status === 'ok') {
      badge = '<div class="pin-badge badge-ok" aria-hidden="true">✓</div>';
    } else if (pin.status === 'ng') {
      badge = '<div class="pin-badge badge-ng" aria-hidden="true">✕</div>';
    } else if (pin.status === 'check') {
      badge = '<div class="pin-badge badge-check" aria-hidden="true">▲</div>';
    }
    el.innerHTML = `
      <svg viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">
        <path class="pin-fill" d="M16 0C9.4 0 4 5.4 4 12c0 9 12 28 12 28S28 21 28 12C28 5.4 22.6 0 16 0z" ${pinColor ? `style="fill:${pinColor}"` : ''}/>
        <circle cx="16" cy="12" r="6" fill="rgba(0,0,0,0.25)"/>
      </svg>
      <div class="pin-num">${pin.num}</div>
      ${badge}
    `;
    el.addEventListener('click', e => { e.stopPropagation(); });
    el.addEventListener('touchstart', e => {
      e.stopPropagation();
      gesture.moved = true;

      const touch = e.touches[0];
      let dragging = false;
      let longPressTimer = null;

      // 長押し判定（500ms）
      longPressTimer = setTimeout(() => {
        dragging = true;
        el.style.opacity = '0.7';
        el.style.transform = 'translate(-50%, -100%) scale(1.3)';
        el.style.zIndex = '50';
      }, 500);

      const onMove = (ev) => {
        if (!dragging) {
          // 少し動いたら長押しキャンセル
          const dx = ev.touches[0].clientX - touch.clientX;
          const dy = ev.touches[0].clientY - touch.clientY;
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
            clearTimeout(longPressTimer);
          }
          return;
        }
        ev.stopPropagation();
        const img = document.getElementById('plan-img');
        const view = document.getElementById('plan-view');
        const rect = view.getBoundingClientRect();
        const imgX = (ev.touches[0].clientX - rect.left - transform.x) / transform.scale;
        const imgY = (ev.touches[0].clientY - rect.top - transform.y) / transform.scale;
        const xPct = Math.max(0, Math.min(1, imgX / img.naturalWidth));
        const yPct = Math.max(0, Math.min(1, imgY / img.naturalHeight));
        pin.x = xPct;
        pin.y = yPct;
        el.style.left = (xPct * img.naturalWidth) + 'px';
        el.style.top = (yPct * img.naturalHeight) + 'px';
      };

      const onEnd = (ev) => {
        clearTimeout(longPressTimer);
        el.removeEventListener('touchmove', onMove);
        el.removeEventListener('touchend', onEnd);
        el.style.opacity = '';
        el.style.transform = '';
        el.style.zIndex = '';
        if (dragging) {
          save();
          dragging = false;
        } else {
          // 短いタップ → 詳細を開く
          openPinDetail(pin.id);
        }
      };

      el.addEventListener('touchmove', onMove, { passive: true });
      el.addEventListener('touchend', onEnd);
    }, { passive: true });
    layer.appendChild(el);
  });
}

function updateStatusChips(status) {

function setPinStatus(status) {

  if (_editingPin.status === status) {

function renderPinPhotos(pin) {
  const container = document.getElementById('pin-photos');
  container.innerHTML = '';
  if (selectState.enabled) {
    container.classList.add('select-mode');
  } else {
    container.classList.remove('select-mode');
  }
  const total = pin.photos.length;
  pin.photos.forEach((photo, i) => {

      thumb.classList.add('selected');
    }

    }
    const upDisabled = i === 0;

    thumb.innerHTML = `
      <img src="${photo}" loading="lazy">

      <button class="save-photo" onclick="event.stopPropagation(); savePhotoToLibrary(${i})">📱 保存</button>
      <button class="del-photo" onclick="event.stopPropagation(); deletePhoto(${i})">✕</button>
      <div class="photo-idx">#${i+1}</div>
      <div class="reorder-controls">
        <button class="ro-btn" ${upDisabled?'disabled':''} onclick="event.stopPropagation(); moveThumb(${i}, -Infinity)" title="最上部へ">⤒</button>
        <button class="ro-btn" ${upDisabled?'disabled':''} onclick="event.stopPropagation(); moveThumb(${i}, -1)" title="1つ上へ">↑</button>
        <button class="ro-btn" ${downDisabled?'disabled':''} onclick="event.stopPropagation(); moveThumb(${i}, 1)" title="1つ下へ">↓</button>
        <button class="ro-btn" ${downDisabled?'disabled':''} onclick="event.stopPropagation(); moveThumb(${i}, Infinity)" title="最下部へ">⤓</button>
        <button class="ro-btn ro-close" onclick="event.stopPropagation(); clearReorderActive()" title="閉じる">✕</button>
      </div>
    `;
    thumb.querySelector('img').onclick = () => {
      if (selectState.enabled) {
        toggleSelectPhoto(i);
      } else {

        if (activeReorderIndex !== -1) {
          clearReorderActive();
        } else {
          openPhotoViewer(i);
        }
      }
    };
    bindLongPressForReorder(thumb, i);
    container.appendChild(thumb);
  });
  refreshPinJumpButtonsSoon();
