}

// ========== PHOTO REORDER (long-press → arrows on one thumb) ==========
// 長押しでアクティブにしたサムネにだけ ↑↓⤒⤓ を表示する方式
let activeReorderIndex = -1; // -1 = 非表示

function clearReorderActive() {
  activeReorderIndex = -1;
  const container = document.getElementById('pin-photos');
  if (container) {
    container.querySelectorAll('.photo-thumb.show-arrows').forEach(el => el.classList.remove('show-arrows'));
  }
}

function setReorderActive(index) {
  if (!_editingPin) return;
  if (index < 0 || index >= _editingPin.photos.length) return;
  // 同じインデックスなら解除 (トグル)
  if (activeReorderIndex === index) {
    clearReorderActive();
    return;
  }
  // 他のモードと排他
  if (selectState && selectState.enabled) exitPhotoSelectMode();
  activeReorderIndex = index;
  const container = document.getElementById('pin-photos');
  if (!container) return;
  container.querySelectorAll('.photo-thumb.show-arrows').forEach(el => el.classList.remove('show-arrows'));
  const thumb = container.querySelector(`.photo-thumb[data-index="${index}"]`);
  if (thumb) {
    thumb.classList.add('show-arrows');
    try { if (navigator.vibrate) navigator.vibrate(15); } catch(_) {}
  }
}

function bindLongPressForReorder(thumb, index) {
  let pressTimer = null;
  let startX = 0, startY = 0;
  let pid = null;
  let active = false; // 長押し未成立(タイマー進行中)
  let justLongPressed = false; // 長押し成立直後フラグ

  thumb.addEventListener('pointerdown', (e) => {
    // 既存の操作と干渉しない
    if (e.target.closest('.del-photo, .save-photo, .photo-check, .ro-btn')) return;
    if (selectState && selectState.enabled) return;
    startX = e.clientX;
    startY = e.clientY;
    pid = e.pointerId;
    active = true;
    justLongPressed = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      if (!active) return;
      setReorderActive(index);
      active = false;
      justLongPressed = true;
    }, 500);
  });

  thumb.addEventListener('pointermove', (e) => {
    if (!active || e.pointerId !== pid) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.hypot(dx, dy) > 15) {
      // 動きすぎたらキャンセル (スクロール意図)
      clearTimeout(pressTimer);
      active = false;
    }
  });

  const endHandler = (e) => {
    if (e.pointerId !== pid) return;
    if (active) {
      clearTimeout(pressTimer);
      active = false;
    }
  };
  thumb.addEventListener('pointerup', endHandler);
  thumb.addEventListener('pointercancel', endHandler);

  // 長押し成立直後のclickイベントを抑制 (写真タップで閉じる動作を防ぐ)
  thumb.addEventListener('click', (e) => {
    if (justLongPressed) {
      justLongPressed = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);
}

function moveThumb(index, direction) {
  // direction: -1=上へ, +1=下へ, -Infinity=最上部, +Infinity=最下部
  if (!_editingPin) return;
  const photos = _editingPin.photos;
  const dates = _editingPin.photoDates || [];
  if (index < 0 || index >= photos.length) return;

  let newIndex;
  if (direction === -Infinity) newIndex = 0;
  else if (direction === Infinity) newIndex = photos.length - 1;
  else newIndex = index + direction;

  if (newIndex < 0) newIndex = 0;
  if (newIndex >= photos.length) newIndex = photos.length - 1;
  if (newIndex === index) return;

  // 並び替え前: 動かすサムネの画面上の位置を記録
  const container = document.getElementById('pin-photos');
  const scroller = getPinModalScrollEl();
  const moving = container ? [...container.querySelectorAll('.photo-thumb')][index] : null;
  const topBefore = moving ? moving.getBoundingClientRect().top : null;

  // 配列の並び替え
  const [photo] = photos.splice(index, 1);
  photos.splice(newIndex, 0, photo);
  if (dates.length > 0) {
    const [d] = dates.splice(index, 1);
    dates.splice(newIndex, 0, d);
  }
  save();

  // DOM を直接更新
  if (!container || !moving) return;
  const allThumbs = [...container.querySelectorAll('.photo-thumb')];

  if (newIndex >= allThumbs.length - 1) {
    container.appendChild(moving);
  } else {
    const ref = newIndex > index ? allThumbs[newIndex + 1] : allThumbs[newIndex];
    container.insertBefore(moving, ref);
  }

  activeReorderIndex = newIndex;
  updateThumbIndices();

  // スクロール追従: 動かしたサムネが画面上の同じ位置に来るよう調整
  if (scroller && topBefore !== null) {
    const topAfter = moving.getBoundingClientRect().top;
    const sr = scroller.getBoundingClientRect();
    const diff = topAfter - topBefore;
    if (diff !== 0) {
      // diff > 0 (移動後の方が下にある) → 画面を下にスクロールして追いつく
      let target = scroller.scrollTop + diff;
      // スクロール範囲外にならないようクランプ
      const max = scroller.scrollHeight - scroller.clientHeight;
      if (target < 0) target = 0;
      if (target > max) target = max;
      scroller.scrollTo({ top: target, behavior: 'smooth' });
    }
  }
}

// renderPinPhotosを全部やり直さず、各サムネのインデックス表示と矢印のdisabled状態だけ更新
function updateThumbIndices() {
  const container = document.getElementById('pin-photos');
  if (!container) return;
  const thumbs = [...container.querySelectorAll('.photo-thumb')];
  const total = thumbs.length;
  thumbs.forEach((thumb, i) => {
    thumb.dataset.index = i;
    // #番号
    const idx = thumb.querySelector('.photo-idx');
    if (idx) idx.textContent = `#${i + 1}`;
    // show-arrows のクラス
    thumb.classList.toggle('show-arrows', i === activeReorderIndex);
    // 矢印のdisabled状態 & onclick の index
    const buttons = thumb.querySelectorAll('.ro-btn');
    if (buttons.length >= 4) {
      const upDisabled = i === 0;
      const downDisabled = i === total - 1;
      buttons[0].disabled = upDisabled; // ⤒
      buttons[1].disabled = upDisabled; // ↑
      buttons[2].disabled = downDisabled; // ↓
      buttons[3].disabled = downDisabled; // ⤓
      // onclick も更新 (古い index で固定されているため)
      buttons[0].onclick = (e) => { e.stopPropagation(); moveThumb(i, -Infinity); };
      buttons[1].onclick = (e) => { e.stopPropagation(); moveThumb(i, -1); };
      buttons[2].onclick = (e) => { e.stopPropagation(); moveThumb(i, 1); };
      buttons[3].onclick = (e) => { e.stopPropagation(); moveThumb(i, Infinity); };
    }
    // 他のボタンのonclick も更新 (削除/保存/チェック)
    const delBtn = thumb.querySelector('.del-photo');
    if (delBtn) delBtn.onclick = (e) => { e.stopPropagation(); deletePhoto(i); };
    const saveBtn = thumb.querySelector('.save-photo');
    if (saveBtn) saveBtn.onclick = (e) => { e.stopPropagation(); savePhotoToLibrary(i); };
    const checkEl = thumb.querySelector('.photo-check');
    if (checkEl) checkEl.onclick = (e) => { e.stopPropagation(); toggleSelectPhoto(i); };
    // img の onclick (写真ビューアを開く / 矢印アクティブ時は閉じる)
    const img = thumb.querySelector('img');
    if (img) {
      img.onclick = () => {
        if (selectState.enabled) {
          toggleSelectPhoto(i);
        } else {
          if (activeReorderIndex !== -1) {
            clearReorderActive();
          } else {
            openPhotoViewer(i);
          }
        }
      };
    }
  });
}

// ========== PHOTO SELECT MODE ==========
let selectState = {
  enabled: false,
  indices: new Set(), // 選択中の写真インデックス
};

function togglePhotoSelectMode() {
  if (selectState.enabled) {
    exitPhotoSelectMode();
  } else {
    enterPhotoSelectMode();
  }
}

function enterPhotoSelectMode() {
  if (!_editingPin || _editingPin.photos.length === 0) return;
  selectState.enabled = true;
  selectState.indices = new Set();
  document.getElementById('pin-photos').classList.add('select-mode');
  document.getElementById('pin-modal').classList.add('select-active');
  document.getElementById('select-toggle').classList.add('active');
  document.getElementById('select-action-bar').classList.add('show');
  updateSelectModeUI();
}

function exitPhotoSelectMode() {
  selectState.enabled = false;
  selectState.indices = new Set();
  const container = document.getElementById('pin-photos');
  if (container) {
    container.classList.remove('select-mode');
    container.querySelectorAll('.photo-thumb.selected').forEach(el => el.classList.remove('selected'));
  }
  const modal = document.getElementById('pin-modal');
  if (modal) modal.classList.remove('select-active');
  const toggle = document.getElementById('select-toggle');
  if (toggle) toggle.classList.remove('active');
  const bar = document.getElementById('select-action-bar');
  if (bar) bar.classList.remove('show');
}

function toggleSelectPhoto(index) {
  if (!selectState.enabled) return;
  if (selectState.indices.has(index)) {
    selectState.indices.delete(index);
  } else {
    selectState.indices.add(index);
  }
  // DOMの反映
  const container = document.getElementById('pin-photos');
  const thumb = container && container.querySelector(`.photo-thumb[data-index="${index}"]`);
  if (thumb) thumb.classList.toggle('selected', selectState.indices.has(index));
  updateSelectModeUI();
}

function selectAllPhotos() {
  if (!selectState.enabled || !_editingPin) return;
  const all = _editingPin.photos.length;
  const allSelected = selectState.indices.size === all;
  if (allSelected) {
    selectState.indices = new Set();
  } else {
    selectState.indices = new Set(Array.from({ length: all }, (_, i) => i));
  }
  // DOM反映
  const container = document.getElementById('pin-photos');
  if (container) {
    container.querySelectorAll('.photo-thumb').forEach(el => {
      const idx = parseInt(el.dataset.index, 10);
      el.classList.toggle('selected', selectState.indices.has(idx));
    });
  }
  updateSelectModeUI();
}

function updateSelectModeUI() {
  // 選択モードトグルの表示制御（写真が1枚もないと無意味）
  const toggle = document.getElementById('select-toggle');
  if (toggle) {
    toggle.style.display = (_editingPin && _editingPin.photos.length > 0) ? 'flex' : 'none';
  }
  // カウントとボタン状態
  const count = selectState.indices.size;
  const countEl = document.getElementById('sel-count');
  if (countEl) countEl.textContent = `${count} 枚選択`;
  const saveBtn = document.getElementById('sel-save-btn');
  const delBtn = document.getElementById('sel-delete-btn');
  if (saveBtn) saveBtn.disabled = count === 0;
  if (delBtn) delBtn.disabled = count === 0;
}

async function saveSelectedPhotos() {
  if (!_editingPin || selectState.indices.size === 0) return;
  // インデックスを昇順で取り出す
  const indices = [...selectState.indices].sort((a, b) => a - b);
  const filenamesJpg = buildPhotoFilenames(_editingPin, 'jpg');
  const filenamesPng = buildPhotoFilenames(_editingPin, 'png');

  const files = indices.map(i => {
    const blob = dataURLToBlob(_editingPin.photos[i]);
    const ext = blob.type === 'image/png' ? 'png' : 'jpg';
    const fname = ext === 'png' ? filenamesPng[i] : filenamesJpg[i];
    return new File([blob], fname, { type: blob.type });
  });

  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({
        files,
        title: `ピン #${_editingPin.num} の写真 (${files.length}枚)`,
      });
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      console.warn('navigator.share failed:', err);
    }
  }

  // フォールバック
  if (files.length === 1) {
    const url = URL.createObjectURL(files[0]);
    const a = document.createElement('a');
    a.href = url; a.download = files[0].name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    alert('この環境ではカメラロールへの直接保存に対応していません。\nダウンロードフォルダに保存しました。');
  } else {
    alert('この環境ではカメラロールへの一括保存に対応していません。\nZIPダウンロードをご利用ください。');
  }
}

function deleteSelectedPhotos() {
  if (!_editingPin || selectState.indices.size === 0) return;
  const count = selectState.indices.size;
  if (!confirm(`選択した ${count} 枚の写真を削除しますか？\nこの操作は元に戻せません。`)) return;

  // 削除前のスクロール参照位置 = 選択した最小インデックスの直前
  const indices = [...selectState.indices].sort((a, b) => a - b);
  const minIdx = indices[0];
  const targetIndex = minIdx === 0 ? 0 : minIdx - 1;

  // 後ろから削除（インデックスがずれないように）
  const sortedDesc = [...indices].sort((a, b) => b - a);
  for (const i of sortedDesc) {
    _editingPin.photos.splice(i, 1);
    if (_editingPin.photoDates) _editingPin.photoDates.splice(i, 1);
  }
  save();

  // 選択状態をリセットして再描画
  selectState.indices = new Set();
  renderPinPhotos(_editingPin);

  // 写真がなくなったら選択モード解除
  if (_editingPin.photos.length === 0) {
    exitPhotoSelectMode();
    return;
  }

  // スクロール位置維持
  const scrollToTarget = () => {
    const container = document.getElementById('pin-photos');
    const scroller = getPinModalScrollEl();
    if (!container || !scroller) return;
    const thumbs = container.querySelectorAll('.photo-thumb');
    const target = thumbs[Math.min(targetIndex, thumbs.length - 1)];
    if (!target) return;
    const tr = target.getBoundingClientRect();
    const sr = scroller.getBoundingClientRect();
    scroller.scrollTo({ top: scroller.scrollTop + (tr.top - sr.top - 12), behavior: 'auto' });
  };
  requestAnimationFrame(() => {
    scrollToTarget();
    setTimeout(scrollToTarget, 50);
    setTimeout(scrollToTarget, 250);
  });

  updateSelectModeUI();
}

// ========== BURST MODE ==========
let burstState = {
  enabled: false,
  count: 0,
};

function loadBurstPref() {
  try {
    burstState.enabled = localStorage.getItem('_burst_mode') === '1';
  } catch(e) {}
  updateBurstUI();
}

function toggleBurstMode() {
  burstState.enabled = !burstState.enabled;
  try { localStorage.setItem('_burst_mode', burstState.enabled ? '1' : '0'); } catch(e) {}
  if (!burstState.enabled) burstState.count = 0;
  updateBurstUI();
}

function stopBurstMode() {
  burstState.enabled = false;
  burstState.count = 0;
  try { localStorage.setItem('_burst_mode', '0'); } catch(e) {}
  updateBurstUI();
}

function updateBurstUI() {
  const toggle = document.getElementById('burst-toggle');
  const banner = document.getElementById('burst-banner');
  const count = document.getElementById('burst-count');
  if (!toggle) return;
  toggle.classList.toggle('active', burstState.enabled);
  // バナーは「連写ON かつ 既に1枚以上撮ってる」ときに表示
  if (banner) {
    if (burstState.enabled && burstState.count > 0) {
      banner.classList.add('show');
      if (count) count.textContent = `(${burstState.count}枚)`;
    } else {
      banner.classList.remove('show');
    }
  }
}

function createCameraInput() {
  // 毎回新しいinputを作成（iOSでonchangeを確実に発火させるため）
  const old = document.getElementById('camera-input');
  if (old) old.remove();
  const input = document.createElement('input');
  input.type = 'file';
  input.id = 'camera-input';
  input.accept = 'image/*';
  input.setAttribute('capture', 'environment');
  // display: none は iOS で .click() を弾くケースがあるため、
  // 見えないけどレイアウトされる状態にする
  input.style.position = 'fixed';
  input.style.left = '-9999px';
  input.style.top = '0';
  input.style.opacity = '0';
  input.style.pointerEvents = 'none';
  input.onchange = function() { handleCameraCapture(this); };
  document.body.appendChild(input);
  return input;
}

function openAspectModal() {
  if (!_editingPin) return;
  state.pendingPhotoForPin = _editingPin.id;
  if (_editingPin.aspect) {
    state.pendingAspect = _editingPin.aspect;
    saveCameraState();
    createCameraInput().click();
  } else {
    openModal('aspect-modal');
  }
}

function deletePhoto(index) {
  if (!_editingPin) return;
  if (!confirm(`写真 #${index+1} を削除しますか？`)) return;

  // 削除後に戻すターゲット: 削除した写真の直前の写真
  // 先頭(index=0)を消した場合は新しい先頭(元index=1)を見せる
  const targetIndex = index === 0 ? 0 : index - 1;

  _editingPin.photos.splice(index, 1);
  if (_editingPin.photoDates) _editingPin.photoDates.splice(index, 1);
  save();
  renderPinPhotos(_editingPin);

  // 再描画後、ターゲット写真の位置にスクロール
  if (_editingPin.photos.length === 0) return;

  const scrollToTarget = () => {
    const container = document.getElementById('pin-photos');
    const scroller = getPinModalScrollEl();
    if (!container || !scroller) return;
    const thumbs = container.querySelectorAll('.photo-thumb');
    const target = thumbs[targetIndex];
    if (!target) return;
    const targetRect = target.getBoundingClientRect();
    const scrollerRect = scroller.getBoundingClientRect();
    const delta = targetRect.top - scrollerRect.top - 12;
    scroller.scrollTo({ top: scroller.scrollTop + delta, behavior: 'auto' });
  };

  requestAnimationFrame(() => {
    scrollToTarget();
    // 画像ロード完了でレイアウトが変わる可能性があるため、もう一度補正
    setTimeout(scrollToTarget, 50);
    setTimeout(scrollToTarget, 250);
  });
}

function startCapture(aspect) {
  state.pendingAspect = aspect || '4:3';
  if (_editingPin && !_editingPin.aspect) _editingPin.aspect = state.pendingAspect;
  saveCameraState();
  closeModal('aspect-modal');
  createCameraInput().click();
}

function saveCameraState() {
  try {
    localStorage.setItem('_cam_pinId', state.pendingPhotoForPin || '');
    localStorage.setItem('_cam_aspect', state.pendingAspect || '4:3');
    localStorage.setItem('_cam_floorId', state.currentFloorId || '');
  } catch(e) {}
}

function restoreCameraState() {
  const pinId = localStorage.getItem('_cam_pinId');
  const aspect = localStorage.getItem('_cam_aspect');
  const floorId = localStorage.getItem('_cam_floorId');
  if (pinId) state.pendingPhotoForPin = pinId;
  if (aspect) state.pendingAspect = aspect;
  if (floorId) state.currentFloorId = floorId;
}

// ========== PHOTO CAPTURE ==========
function handleCameraCapture(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const pinId = state.pendingPhotoForPin;
  const floorId = state.currentFloorId;
  const aspect = state.pendingAspect || '4:3';

  if (!pinId) return;

  // 連写モード: 画像処理の前に、まず次のカメラを起動する
  // (Android Chromeは change イベント直後しかuser activationを認めないため)
  let nextCameraInput = null;
  if (burstState.enabled) {
    try {
      nextCameraInput = createCameraInput();
      // 同期で click() を呼ぶ。これが change イベントから直接呼ばれている間に実行される必要がある
      nextCameraInput.click();
      burstState.count++;
      updateBurstUI();
    } catch(err) {
      console.warn('burst chain click failed:', err);
      stopBurstMode();
    }
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // トリミング計算
      let sx = 0, sy = 0, cw = img.width, ch = img.height;
      const r = aspect === '16:9' ? 16/9 : 4/3;
      if (img.width / img.height > r) {
        cw = Math.round(img.height * r);
        sx = Math.round((img.width - cw) / 2);
      } else {
        ch = Math.round(img.width / r);
        sy = Math.round((img.height - ch) / 2);
      }
      const max = 1280;
      let dw = cw, dh = ch;
      if (dw > max) { dh = Math.round(dh * max / dw); dw = max; }
      if (dh > max) { dw = Math.round(dw * max / dh); dh = max; }

      const canvas = document.createElement('canvas');
      canvas.width = dw; canvas.height = dh;
      canvas.getContext('2d').drawImage(img, sx, sy, cw, ch, 0, 0, dw, dh);
      const data = canvas.toDataURL('image/jpeg', 0.75);

      // 直接保存
      const floor = getFloor(floorId) || state.floors.find(f => f.pins && f.pins.some(p => p.id === pinId));
      if (!floor) return;
      const pin = floor.pins.find(p => p.id === pinId);
      if (!pin) return;

      if (!pin.photos) pin.photos = [];
      if (!pin.photoDates) pin.photoDates = [];
      pin.photos.push(data);
      pin.photoDates.push(new Date().toISOString());
      if (!pin.aspect) pin.aspect = aspect;
      state.currentFloorId = floor.id;
      _editingPin = pin;
      save();

      // 表示更新
      renderPinPhotos(pin);
      document.getElementById('pin-modal-title').textContent = '📍 ピン #' + pin.num;
      document.getElementById('btn-pin-zip').style.display = 'block';
      const saveBtn2 = document.getElementById('btn-pin-save-photos');
      if (saveBtn2) saveBtn2.style.display = 'block';
      if (!document.getElementById('pin-modal').classList.contains('open')) {
        openModal('pin-modal');
        document.getElementById('float-camera-btn').style.display = 'flex';
        document.getElementById('float-home-btn').style.display = 'flex';
      }

      // 撮った写真までスクロール (連写中はスキップしてユーザーをイラつかせない)
      if (!burstState.enabled) {
        const newIndex = pin.photos.length - 1;
        setTimeout(() => {
          const container = document.getElementById('pin-photos');
          const scroller = getPinModalScrollEl();
          if (!container || !scroller) return;
          const thumbs = container.querySelectorAll('.photo-thumb');
          const target = thumbs[newIndex];
          if (!target) return;
          const tr = target.getBoundingClientRect();
          const sr = scroller.getBoundingClientRect();
          const delta = tr.top - sr.top - 12;
          scroller.scrollTo({ top: scroller.scrollTop + delta, behavior: 'smooth' });
        }, 150);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ========== TRANSFORM ==========
function applyTransform() {
  const wrap = document.getElementById('plan-canvas-wrap');
  wrap.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
}

function setupGestures() {
  const view = document.getElementById('plan-view');

  view.addEventListener('touchstart', onTouchStart, { passive: false });
  view.addEventListener('touchmove', onTouchMove, { passive: false });
  view.addEventListener('touchend', onTouchEnd, { passive: false });
  view.addEventListener('click', onClick);
}

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    gesture.fingers = 1;
    gesture.startX = e.touches[0].clientX;
    gesture.startY = e.touches[0].clientY;
    gesture.startTX = transform.x;
    gesture.startTY = transform.y;
    gesture.moved = false;
  } else if (e.touches.length === 2) {
    gesture.fingers = 2;
    gesture.startDist = getTouchDist(e.touches);
    gesture.startScale = transform.scale;
    gesture.midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    gesture.midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    gesture.startTX = transform.x;
    gesture.startTY = transform.y;
    gesture.moved = true;
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = getTouchDist(e.touches);
    const newScale = Math.max(0.3, Math.min(5, gesture.startScale * dist / gesture.startDist));
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const viewRect = document.getElementById('plan-view').getBoundingClientRect();
    const pivotX = cx - viewRect.left;
    const pivotY = cy - viewRect.top;
    const startPivotX = gesture.midX - viewRect.left;
    const startPivotY = gesture.midY - viewRect.top;
    transform.x = gesture.startTX + (pivotX - startPivotX) + (startPivotX - gesture.startTX) * (1 - newScale / gesture.startScale);
    transform.y = gesture.startTY + (pivotY - startPivotY) + (startPivotY - gesture.startTY) * (1 - newScale / gesture.startScale);
    transform.scale = newScale;
    applyTransform();
    gesture.moved = true;
  } else if (e.touches.length === 1 && gesture.fingers === 1) {
    const dx = e.touches[0].clientX - gesture.startX;
    const dy = e.touches[0].clientY - gesture.startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) gesture.moved = true;
    if (state.mode === 'move' && gesture.moved) {
      transform.x = gesture.startTX + dx;
      transform.y = gesture.startTY + dy;
      applyTransform();
    }
  }
}

function onTouchEnd(e) {
  if (e.touches.length === 0) {
    if (gesture.fingers === 1 && !gesture.moved && state.mode === 'pin') {
      const floor = getFloor(state.currentFloorId);
      if (floor && floor.imageData) {
        const view = document.getElementById('plan-view');
        const img = document.getElementById('plan-img');
        const rect = view.getBoundingClientRect();
        const touch = e.changedTouches[0];
        const imgX = (touch.clientX - rect.left - transform.x) / transform.scale;
        const imgY = (touch.clientY - rect.top - transform.y) / transform.scale;
        const xPct = imgX / img.naturalWidth;
        const yPct = imgY / img.naturalHeight;
        if (xPct >= 0 && xPct <= 1 && yPct >= 0 && yPct <= 1) {
          createPin(xPct, yPct);
        }
      }
    }
    gesture.fingers = 0;
    gesture.moved = false;
  } else if (e.touches.length === 1) {
    gesture.fingers = 1;
    gesture.startX = e.touches[0].clientX;
    gesture.startY = e.touches[0].clientY;
    gesture.startTX = transform.x;
    gesture.startTY = transform.y;
    gesture.moved = true;
  }
}

function onClick(e) {
  // PCマウス用（タッチはonTouchEndで処理）
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  if (state.mode !== 'pin') return;
  if (gesture.moved) return;
  const floor = getFloor(state.currentFloorId);
  if (!floor || !floor.imageData) return;
  const view = document.getElementById('plan-view');
  const img = document.getElementById('plan-img');
  const rect = view.getBoundingClientRect();
  const imgX = (e.clientX - rect.left - transform.x) / transform.scale;
  const imgY = (e.clientY - rect.top - transform.y) / transform.scale;
  const xPct = imgX / img.naturalWidth;
  const yPct = imgY / img.naturalHeight;
  if (xPct < 0 || xPct > 1 || yPct < 0 || yPct > 1) return;
  createPin(xPct, yPct);
}

function getTouchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

  document.getElementById(id).classList.remove('open');

// ========== PHOTO VIEWER ==========
let viewerState = {
  scale: 1, x: 0, y: 0,
  minScale: 1, maxScale: 6,
  // pointer tracking
  pointers: new Map(), // pointerId -> {x, y}
  startDist: 0,
  startScale: 1,
  startMidX: 0, startMidY: 0,
  startX: 0, startY: 0,
  // double tap
  lastTapTime: 0,
  lastTapX: 0, lastTapY: 0,
  // base image size after CSS sizing
  baseW: 0, baseH: 0,
  baseOffsetX: 0, baseOffsetY: 0,
};

function applyViewerTransform() {
  const img = document.getElementById('viewer-img');
  img.style.transform = `translate(${viewerState.x}px, ${viewerState.y}px) scale(${viewerState.scale})`;
}

function resetViewerTransform() {
  viewerState.scale = 1;
  viewerState.x = 0;
  viewerState.y = 0;
  applyViewerTransform();
}

function measureViewerImage() {
  const img = document.getElementById('viewer-img');
  const rect = img.getBoundingClientRect();
  // Note: at scale=1, x=0,y=0, getBoundingClientRect returns the laid-out image rect
  viewerState.baseW = img.offsetWidth;
  viewerState.baseH = img.offsetHeight;
  // offset from stage origin (top-left) to image top-left at scale=1
  const stage = document.getElementById('viewer-stage');
  const sRect = stage.getBoundingClientRect();
  viewerState.baseOffsetX = rect.left - sRect.left;
  viewerState.baseOffsetY = rect.top - sRect.top;
}

function clampViewerPan() {
  // After scaling around (0,0) with origin top-left, image occupies:
  // x in [baseOffsetX + x, baseOffsetX + x + baseW*scale]
  // y in [baseOffsetY + y, baseOffsetY + y + baseH*scale]
  // We allow the image to be panned but keep at least some part visible.
  // Specifically, image must cover the viewport at scale > 1, otherwise center it.
  const stage = document.getElementById('viewer-stage');
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const imgW = viewerState.baseW * viewerState.scale;
  const imgH = viewerState.baseH * viewerState.scale;
  const ox = viewerState.baseOffsetX;
  const oy = viewerState.baseOffsetY;

  // Horizontal
  if (imgW <= sw) {
    // center horizontally: set x so image center == stage center
    viewerState.x = (sw - imgW) / 2 - ox;
  } else {
    const minX = sw - ox - imgW; // right edge >= sw -> ox + x + imgW >= sw -> x >= sw - ox - imgW
    const maxX = -ox;            // left edge <= 0  -> ox + x <= 0 -> x <= -ox
    if (viewerState.x < minX) viewerState.x = minX;
    if (viewerState.x > maxX) viewerState.x = maxX;
  }
  // Vertical
  if (imgH <= sh) {
    viewerState.y = (sh - imgH) / 2 - oy;
  } else {
    const minY = sh - oy - imgH;
    const maxY = -oy;
    if (viewerState.y < minY) viewerState.y = minY;
    if (viewerState.y > maxY) viewerState.y = maxY;
  }
}

function setupPhotoViewerGestures() {
  const viewer = document.getElementById('photo-viewer');
  const img = document.getElementById('viewer-img');

  const getDist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
  const getMid = (p1, p2) => ({ x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });

  // Convert client coord to image-local coord (in pre-scale image pixels relative to stage origin)
  // stageCoord = baseOffset + viewerState.{x,y} + imgLocal * scale
  // => imgLocal = (stageCoord - baseOffset - viewerState.xy) / scale
  function stagePointFromClient(cx, cy) {
    const stage = document.getElementById('viewer-stage');
    const r = stage.getBoundingClientRect();
    return { x: cx - r.left, y: cy - r.top };
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    viewer.setPointerCapture(e.pointerId);
    viewerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (viewerState.pointers.size === 1) {
      const sp = stagePointFromClient(e.clientX, e.clientY);
      viewerState.startMidX = sp.x;
      viewerState.startMidY = sp.y;
      viewerState.startX = viewerState.x;
      viewerState.startY = viewerState.y;
    } else if (viewerState.pointers.size === 2) {
      const pts = [...viewerState.pointers.values()];
      viewerState.startDist = getDist(pts[0], pts[1]);
      viewerState.startScale = viewerState.scale;
      const mid = getMid(pts[0], pts[1]);
      const sp = stagePointFromClient(mid.x, mid.y);
      viewerState.startMidX = sp.x;
      viewerState.startMidY = sp.y;
      viewerState.startX = viewerState.x;
      viewerState.startY = viewerState.y;
    }
  }

  function onPointerMove(e) {
    if (!viewerState.pointers.has(e.pointerId)) return;
    viewerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (viewerState.pointers.size === 1 && viewerState.scale > 1) {
      // pan
      const sp = stagePointFromClient(e.clientX, e.clientY);
      const dx = sp.x - viewerState.startMidX;
      const dy = sp.y - viewerState.startMidY;
      viewerState.x = viewerState.startX + dx;
      viewerState.y = viewerState.startY + dy;
      clampViewerPan();
      applyViewerTransform();
    } else if (viewerState.pointers.size === 2) {
      // pinch zoom
      const pts = [...viewerState.pointers.values()];
      const dist = getDist(pts[0], pts[1]);
      if (viewerState.startDist <= 0) {
        viewerState.startDist = dist;
        return;
      }
      let newScale = viewerState.startScale * (dist / viewerState.startDist);
      if (newScale < viewerState.minScale) newScale = viewerState.minScale;
      if (newScale > viewerState.maxScale) newScale = viewerState.maxScale;

      // Zoom around the initial midpoint (in stage coords).
      // Image-local point at start midpoint:
      // localX = (startMidX - baseOffsetX - startX) / startScale
      // After zoom, we want that same local point to remain at startMidX:
      // startMidX = baseOffsetX + newX + localX * newScale
      // => newX = startMidX - baseOffsetX - localX * newScale
      const localX = (viewerState.startMidX - viewerState.baseOffsetX - viewerState.startX) / viewerState.startScale;
      const localY = (viewerState.startMidY - viewerState.baseOffsetY - viewerState.startY) / viewerState.startScale;

      // Also account for finger drift: shift by midpoint movement
      const curMid = getMid(pts[0], pts[1]);
      const csp = stagePointFromClient(curMid.x, curMid.y);
      const driftX = csp.x - viewerState.startMidX;
      const driftY = csp.y - viewerState.startMidY;

      viewerState.scale = newScale;
      viewerState.x = viewerState.startMidX + driftX - viewerState.baseOffsetX - localX * newScale;
      viewerState.y = viewerState.startMidY + driftY - viewerState.baseOffsetY - localY * newScale;
      clampViewerPan();
      applyViewerTransform();
    }
  }

  function onPointerUp(e) {
    viewerState.pointers.delete(e.pointerId);
    try { viewer.releasePointerCapture(e.pointerId); } catch(_) {}

    // If we just dropped from 2 fingers to 1, reset single-finger start anchor
    if (viewerState.pointers.size === 1) {
      const [p] = viewerState.pointers.values();
      const sp = stagePointFromClient(p.x, p.y);
      viewerState.startMidX = sp.x;
      viewerState.startMidY = sp.y;
      viewerState.startX = viewerState.x;
      viewerState.startY = viewerState.y;
    }

    // Snap back if below min
    if (viewerState.pointers.size === 0 && viewerState.scale < 1.02) {
      resetViewerTransform();
    }
  }

  viewer.addEventListener('pointerdown', onPointerDown);
  viewer.addEventListener('pointermove', onPointerMove);
  viewer.addEventListener('pointerup', onPointerUp);
  viewer.addEventListener('pointercancel', onPointerUp);

  // Double tap to toggle zoom
  viewer.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse') return;
    // Only react when this was a tap (no pinch active)
    if (viewerState.pointers.size > 0) return;

    const now = Date.now();
    const dt = now - viewerState.lastTapTime;
    const dx = e.clientX - viewerState.lastTapX;
    const dy = e.clientY - viewerState.lastTapY;
    const dist = Math.hypot(dx, dy);

    if (dt < 300 && dist < 30) {
      // Double tap
      const sp = stagePointFromClient(e.clientX, e.clientY);
      if (viewerState.scale > 1.05) {
        resetViewerTransform();
      } else {
        const targetScale = 2.5;
        // zoom around (sp.x, sp.y)
        const localX = (sp.x - viewerState.baseOffsetX - viewerState.x) / viewerState.scale;
        const localY = (sp.y - viewerState.baseOffsetY - viewerState.y) / viewerState.scale;
        viewerState.scale = targetScale;
        viewerState.x = sp.x - viewerState.baseOffsetX - localX * targetScale;
        viewerState.y = sp.y - viewerState.baseOffsetY - localY * targetScale;
        clampViewerPan();
        applyViewerTransform();
      }
      viewerState.lastTapTime = 0;
    } else {
      viewerState.lastTapTime = now;
      viewerState.lastTapX = e.clientX;
      viewerState.lastTapY = e.clientY;
    }
  });

  // Mouse wheel zoom (for iPad with mouse / desktop)
  viewer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const sp = stagePointFromClient(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    let newScale = viewerState.scale * factor;
    if (newScale < viewerState.minScale) newScale = viewerState.minScale;
    if (newScale > viewerState.maxScale) newScale = viewerState.maxScale;
    const localX = (sp.x - viewerState.baseOffsetX - viewerState.x) / viewerState.scale;
    const localY = (sp.y - viewerState.baseOffsetY - viewerState.y) / viewerState.scale;
    viewerState.scale = newScale;
    viewerState.x = sp.x - viewerState.baseOffsetX - localX * newScale;
    viewerState.y = sp.y - viewerState.baseOffsetY - localY * newScale;
    clampViewerPan();
    applyViewerTransform();
  }, { passive: false });

  // Recompute base size after image loads
  img.addEventListener('load', () => {
    resetViewerTransform();
    measureViewerImage();
  });

  // Recompute on resize / orientation change
  window.addEventListener('resize', () => {
    if (document.getElementById('photo-viewer').classList.contains('open')) {
      resetViewerTransform();
      measureViewerImage();
    }
    if (document.getElementById('pin-modal').classList.contains('open')) {
      updatePinJumpButtons();
    }
  });
}

// ========== PHOTO VIEWER (with actions) ==========
let _viewerCurrentIndex = -1; // _editingPin.photos の現在表示中インデックス

function openPhotoViewer(srcOrIndex) {
  // 後方互換: 文字列(dataURL)が来たら _editingPin.photos から探す
  let index = -1;
  if (typeof srcOrIndex === 'number') {
    index = srcOrIndex;
  } else if (typeof srcOrIndex === 'string' && _editingPin) {
    index = _editingPin.photos.indexOf(srcOrIndex);
  }
  if (index < 0 || !_editingPin || !_editingPin.photos[index]) return;

  _viewerCurrentIndex = index;
  const img = document.getElementById('viewer-img');
  resetViewerTransform();
  img.src = _editingPin.photos[index];
  document.getElementById('photo-viewer').classList.add('open');
  document.body.classList.add('viewer-open');
  updateViewerToolbar();

  requestAnimationFrame(() => {
    measureViewerImage();
  });
  const hint = document.getElementById('viewer-hint');
  if (hint) {
    hint.style.opacity = '1';
    clearTimeout(openPhotoViewer._hintTimer);
    openPhotoViewer._hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 2000);
  }
}

function updateViewerToolbar() {
  if (!_editingPin) return;
  const total = _editingPin.photos.length;
  const counter = document.getElementById('viewer-counter');
  if (counter) counter.textContent = `${_viewerCurrentIndex + 1} / ${total}`;
  // ナビボタンは2枚以上で表示
  const prev = document.getElementById('viewer-nav-prev');
  const next = document.getElementById('viewer-nav-next');
  if (prev) prev.classList.toggle('show', total > 1 && _viewerCurrentIndex > 0);
  if (next) next.classList.toggle('show', total > 1 && _viewerCurrentIndex < total - 1);
}

function navigateViewer(delta) {
  if (!_editingPin) return;
  const total = _editingPin.photos.length;
  const newIndex = _viewerCurrentIndex + delta;
  if (newIndex < 0 || newIndex >= total) return;
  _viewerCurrentIndex = newIndex;
  resetViewerTransform();
  const img = document.getElementById('viewer-img');
  img.src = _editingPin.photos[newIndex];
  updateViewerToolbar();
  requestAnimationFrame(() => measureViewerImage());
}

async function saveCurrentViewerPhoto() {
  if (!_editingPin || _viewerCurrentIndex < 0) return;
  await savePhotoToLibrary(_viewerCurrentIndex);
}

function deleteCurrentViewerPhoto() {
  if (!_editingPin || _viewerCurrentIndex < 0) return;
  const idx = _viewerCurrentIndex;
  if (!confirm(`写真 #${idx+1} を削除しますか？`)) return;

  _editingPin.photos.splice(idx, 1);
  if (_editingPin.photoDates) _editingPin.photoDates.splice(idx, 1);
  save();
  renderPinPhotos(_editingPin);

  // 写真が全部消えたらビューアを閉じる
  if (_editingPin.photos.length === 0) {
    closePhotoViewer();
    return;
  }
  // 次の写真にスライド: 最後の写真を消した場合は1つ前へ
  const nextIndex = Math.min(idx, _editingPin.photos.length - 1);
  _viewerCurrentIndex = nextIndex;
  resetViewerTransform();
  const img = document.getElementById('viewer-img');
  img.src = _editingPin.photos[nextIndex];
  updateViewerToolbar();
  requestAnimationFrame(() => measureViewerImage());

  // ピン詳細モーダル側のスクロール位置も合わせる
  // (ビューアを閉じた後に正しい位置が見えるように)
  const targetThumbIndex = nextIndex;
  setTimeout(() => {
    const container = document.getElementById('pin-photos');
    const scroller = getPinModalScrollEl();
    if (!container || !scroller) return;
    const thumbs = container.querySelectorAll('.photo-thumb');
    const target = thumbs[targetThumbIndex];
    if (!target) return;
    const tr = target.getBoundingClientRect();
    const sr = scroller.getBoundingClientRect();
    scroller.scrollTo({ top: scroller.scrollTop + (tr.top - sr.top - 12), behavior: 'auto' });
  }, 50);
}

function closePhotoViewer() {
  document.getElementById('photo-viewer').classList.remove('open');
  document.body.classList.remove('viewer-open');
  resetViewerTransform();
  _viewerCurrentIndex = -1;
}

// Initialize viewer gestures once DOM is ready
setupPhotoViewerGestures();

// ========== SAVE TO PHOTO LIBRARY ==========
function dataURLToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:([^;]+)/) || [,'image/jpeg'])[1];
  const bin = atob(b64);
  const len = bin.length;
  const arr = new Uint8Array(len);
  for (let i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// ピン内の各写真のファイル名を生成: YYYYMMDD-NN.jpg
// 同じ日に撮られた写真同士で日内連番を採番する
function buildPhotoFilenames(pin, ext) {
  const photos = pin.photos || [];
  const dates = pin.photoDates || [];
  const fallbackISO = pin.createdAt || new Date().toISOString();

  // 日付ごとに「その日の何枚目か」をカウント
  const seqByDate = {};
  return photos.map((_, i) => {
    const iso = dates[i] || fallbackISO;
    const d = new Date(iso);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const dateStr = `${y}${m}${day}`;
    seqByDate[dateStr] = (seqByDate[dateStr] || 0) + 1;
    const seq = String(seqByDate[dateStr]).padStart(2, '0');
    return `${dateStr}-${seq}.${ext}`;
  });
}

// 今日の日付を YYYYMMDD 形式で
function todayYYYYMMDD() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

// ファイル名に使えるよう不正文字を置換
function safeFileName(s) {
  return String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || '無題';
}

// 同日内のバックアップ連番を払い出して保存
// 戻り値: '01', '02', ...
function nextBackupSeqForToday() {
  const today = todayYYYYMMDD();
  let seq = 1;
  try {
    const raw = localStorage.getItem('_backup_seq');
    if (raw) {
      const obj = JSON.parse(raw);
      if (obj && obj.date === today && Number.isInteger(obj.seq)) {
        seq = obj.seq + 1;
      }
    }
    localStorage.setItem('_backup_seq', JSON.stringify({ date: today, seq }));
  } catch(e) {
    // localStorage失敗時は1から
  }
  return String(seq).padStart(2, '0');
}

async function savePinPhotosToLibrary() {
  if (!_editingPin) return;
  const photos = _editingPin.photos || [];
  if (photos.length === 0) { alert('写真がありません'); return; }

  // 写真の拡張子を判定(全部jpg想定だが一応個別に)
  const ext = (dataURLToBlob(photos[0]).type === 'image/png') ? 'png' : 'jpg';
  const filenames = buildPhotoFilenames(_editingPin, ext);

  // Convert all photos to File objects
  const files = photos.map((dataUrl, i) => {
    const blob = dataURLToBlob(dataUrl);
    const fileExt = blob.type === 'image/png' ? 'png' : 'jpg';
    // 拡張子がmix時のためファイル名末尾を実際の型に合わせる
    const filename = filenames[i].replace(/\.(jpg|png)$/, '.' + fileExt);
    return new File([blob], filename, { type: blob.type });
  });

  // Web Share API (iOS Safariで共有シート→「画像を保存」でカメラロールへ)
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({
        files,
        title: `ピン #${_editingPin.num} の写真`,
      });
      return;
    } catch(err) {
      // ユーザーがキャンセルした場合はAbortError - 黙ってreturn
      if (err && err.name === 'AbortError') return;
      console.warn('navigator.share failed:', err);
      // フォールバックへ
    }
  }

  // フォールバック: 1枚だけならダウンロード、複数なら案内
  if (files.length === 1) {
    const url = URL.createObjectURL(files[0]);
    const a = document.createElement('a');
    a.href = url;
    a.download = files[0].name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    alert('この環境ではカメラロールへの直接保存に対応していません。\nダウンロードフォルダに保存しました。');
  } else {
    alert('この環境ではカメラロールへの一括保存に対応していません。\nZIPダウンロードをご利用ください。');
  }
}

async function savePhotoToLibrary(index) {
  if (!_editingPin) return;
  const photo = _editingPin.photos[index];
  if (!photo) return;

  const blob = dataURLToBlob(photo);
  const ext = blob.type === 'image/png' ? 'png' : 'jpg';
  const filenames = buildPhotoFilenames(_editingPin, ext);
  const filename = filenames[index] || `photo-${index+1}.${ext}`;
  const file = new File([blob], filename, { type: blob.type });

  // Web Share API: 1枚なら最も安定して動く
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: `ピン #${_editingPin.num} 写真 #${index+1}`,
      });
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      console.warn('navigator.share failed:', err);
    }
  }

  // フォールバック: 通常ダウンロード
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildPinZip(pin) {
  if (typeof JSZip === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = () => doPinZip(pin);
    script.onerror = () => alert('JSZipの読み込みに失敗しました。ネット接続を確認してください。');
    document.head.appendChild(script);
  } else {
    doPinZip(pin);
  }
}

async function doPinZip(pin) {
  const progressWrap = document.getElementById('pin-zip-progress');
  const progressBar = document.getElementById('pin-zip-bar');
  const progressText = document.getElementById('pin-zip-text');
  progressWrap.style.display = 'block';

  const zip = new JSZip();
  const floor = getFloor(state.currentFloorId);
  const statusStr = { ok:'OK', ng:'NG', check:'確認中', none:'未設定' }[pin.status] || '未設定';

  // Add memo as txt
  if (pin.memo) {
    zip.file('memo.txt', `ピン#${pin.num} [${statusStr}]\n\n${pin.memo}\n作成: ${new Date(pin.createdAt).toLocaleString('ja-JP')}`);
  }

  const filenamesByType = { jpg: buildPhotoFilenames(pin, 'jpg'), png: buildPhotoFilenames(pin, 'png') };
  pin.photos.forEach((dataUrl, i) => {
    const base64 = dataUrl.split(',')[1];
    const ext = dataUrl.includes('image/png') ? 'png' : 'jpg';
    zip.file(filenamesByType[ext][i], base64, { base64: true });
    const pct = Math.round((i+1) / pin.photos.length * 80);
    progressBar.style.width = pct + '%';
    progressText.textContent = `まとめています... ${i+1}/${pin.photos.length}枚`;
  });

  progressText.textContent = '圧縮中...';
  progressBar.style.width = '90%';

  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  const floorName = safeFileName(floor ? floor.name : '図面');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${todayYYYYMMDD()}_${floorName}_ピン${pin.num}.zip`;
  a.click();
  URL.revokeObjectURL(url);

  progressBar.style.width = '100%';
  progressText.textContent = 'ダウンロード完了！';
  setTimeout(() => {
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
  }, 2000);
}


function buildZip(floors) {
  if (typeof JSZip === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = () => doZip(floors);
    script.onerror = () => alert('JSZipの読み込みに失敗しました。ネット接続を確認してください。');
    document.head.appendChild(script);
  } else {
    doZip(floors);
  }
}

async function doZip(floors) {
  const progressWrap = document.getElementById('export-progress');
  const progressBar = document.getElementById('export-progress-bar');
  const progressText = document.getElementById('export-progress-text');
  progressWrap.style.display = 'block';

  const zip = new JSZip();
  let total = floors.reduce((s, f) => s + f.pins.reduce((ss, p) => ss + p.photos.length, 0), 0);
  let done = 0;

  for (const floor of floors) {
    const floorFolder = zip.folder(floor.name);

    // Add report txt in each floor folder
    const lines = [`図面: ${floor.name}`, `出力日: ${new Date().toLocaleString('ja-JP')}`, ``];
    floor.pins.forEach(pin => {
      lines.push(`ピン#${pin.num} [${statusLabel(pin.status).replace(/[✅❌⚠️]/g,'').trim()}] 写真${pin.photos.length}枚`);
      if (pin.memo) lines.push(`  メモ: ${pin.memo}`);
    });
    floorFolder.file('report.txt', lines.join('\n'));

    for (const pin of floor.pins) {
      if (pin.photos.length === 0) continue;
      const statusStr = { ok:'OK', ng:'NG', check:'確認中', none:'未設定' }[pin.status] || '未設定';
      const folderName = `ピン${pin.num}_${statusStr}`;
      const pinFolder = floorFolder.folder(folderName);
      const filenamesJpg = buildPhotoFilenames(pin, 'jpg');
      const filenamesPng = buildPhotoFilenames(pin, 'png');

      pin.photos.forEach((dataUrl, i) => {
        const base64 = dataUrl.split(',')[1];
        const ext = dataUrl.includes('image/png') ? 'png' : 'jpg';
        const fname = ext === 'png' ? filenamesPng[i] : filenamesJpg[i];
        pinFolder.file(fname, base64, { base64: true });
        done++;
        const pct = Math.round(done / total * 100);
        progressBar.style.width = pct + '%';
        progressText.textContent = `ZIPを作成中... ${done}/${total}枚`;
      });
    }
  }

  progressText.textContent = 'ZIPを圧縮中...';
  progressBar.style.width = '100%';

  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  const name = safeFileName(floors.length === 1 ? floors[0].name : '全図面');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${todayYYYYMMDD()}_${name}.zip`;
  a.click();
  URL.revokeObjectURL(url);

  progressWrap.style.display = 'none';
  progressBar.style.width = '0%';
  closeModal('export-modal');
}





// ========== BACKUP / IMPORT ==========
const BACKUP_VERSION = 1;
let _pendingImport = null; // {folders, floors}

function estimateBackupSize() {
  // Rough: sum length of dataURLs as bytes proxy
  let bytes = 0;
  for (const f of state.floors) {
    if (f.imageData) bytes += f.imageData.length;
    for (const p of (f.pins || [])) {
      for (const ph of (p.photos || [])) bytes += ph.length;
    }
  }
  return bytes;
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}

function exportBackup() {
  const approx = estimateBackupSize();
  if (state.folders.length === 0 && state.floors.length === 0) {
    alert('バックアップ対象のデータがありません');
    return;
  }
  if (approx > 200 * 1024 * 1024) {
    if (!confirm(`バックアップサイズが約 ${formatBytes(approx)} と大きいです。\n書き出しに時間がかかる可能性があります。続行しますか？`)) return;
  }

  closeModal('export-modal');

  try {
    const backup = {
      app: 'inspection_app_v2',
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      folders: state.folders,
      floors: state.floors,
    };
    const json = JSON.stringify(backup);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const seq = nextBackupSeqForToday();
    a.href = url;
    a.download = `Backup${todayYYYYMMDD()}-${seq}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(e) {
    alert('バックアップ書き出し失敗: ' + e.message);
  }
}

function handleBackupFile(input) {
  const file = input.files && input.files[0];
  input.value = ''; // allow re-selecting same file later
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('JSONの形式が不正です');
      if (!Array.isArray(data.folders) || !Array.isArray(data.floors)) {
        throw new Error('folders / floors が見つかりません');
      }
      // Light validation
      for (const fl of data.floors) {
        if (typeof fl.id !== 'string' || typeof fl.name !== 'string') {
          throw new Error('図面データの形式が不正です');
        }
        if (!Array.isArray(fl.pins)) fl.pins = [];
      }
      _pendingImport = data;
      showImportSummary(data);
      openModal('import-modal');
    } catch(err) {
      alert('読み込めませんでした: ' + err.message);
    }
  };
  reader.onerror = () => alert('ファイルの読み込みに失敗しました');
  reader.readAsText(file);
}

function showImportSummary(data) {
  const folderCount = data.folders.length;
  const floorCount = data.floors.length;
  let pinCount = 0, photoCount = 0;
  for (const f of data.floors) {
    pinCount += (f.pins || []).length;
    for (const p of (f.pins || [])) photoCount += (p.photos || []).length;
  }
  const exported = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '不明';
  const el = document.getElementById('import-summary');
  el.innerHTML = `
    <div>書き出し日時: ${exported}</div>
    <div>フォルダ: ${folderCount}件 / 図面: ${floorCount}件</div>
    <div>ピン: ${pinCount}件 / 写真: ${photoCount}枚</div>
  `;
}

function cancelImport() {
  _pendingImport = null;
  closeModal('import-modal');
}

async function confirmImport(mode) {
  if (!_pendingImport) { closeModal('import-modal'); return; }

  if (mode === 'replace') {
    if (!confirm('既存データを全て削除して、バックアップで置き換えます。\nこの操作は元に戻せません。よろしいですか？')) return;
  }

  const data = _pendingImport;

  try {
    if (mode === 'replace') {
      state.folders = JSON.parse(JSON.stringify(data.folders));
      state.floors = JSON.parse(JSON.stringify(data.floors));
    } else {
      // merge: re-ID anything that collides
      const existingFolderIds = new Set(state.folders.map(f => f.id));
      const existingFloorIds = new Set(state.floors.map(f => f.id));
      const folderIdMap = {}; // oldId -> newId

      const maxFolderOrder = state.folders.reduce((m,f)=>Math.max(m, f.order||0), -1);
      const maxFloorOrder = state.floors.reduce((m,f)=>Math.max(m, f.order||0), -1);

      data.folders.forEach((f, i) => {
        const copy = JSON.parse(JSON.stringify(f));
        if (existingFolderIds.has(copy.id)) {
          const newId = 'folder_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
          folderIdMap[copy.id] = newId;
          copy.id = newId;
        }
        copy.order = maxFolderOrder + 1 + i;
        state.folders.push(copy);
        existingFolderIds.add(copy.id);
      });

      data.floors.forEach((fl, i) => {
        const copy = JSON.parse(JSON.stringify(fl));
        if (existingFloorIds.has(copy.id)) {
          copy.id = 'floor_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        }
        // remap folderId if folder was renamed
        if (copy.folderId && folderIdMap[copy.folderId]) {
          copy.folderId = folderIdMap[copy.folderId];
        }
        // if folderId references a non-existent folder, create / attach to "復元" folder
        if (!copy.folderId || !state.folders.some(f => f.id === copy.folderId)) {
          let restoredFolder = state.folders.find(f => f.name === '復元');
          if (!restoredFolder) {
            restoredFolder = {
              id: 'folder_restored_' + Date.now(),
              name: '復元',
              order: maxFolderOrder + 1 + data.folders.length,
            };
            state.folders.push(restoredFolder);
          }
          copy.folderId = restoredFolder.id;
        }
        copy.order = maxFloorOrder + 1 + i;
        state.floors.push(copy);
        existingFloorIds.add(copy.id);
      });
    }

    await save();

    // refresh UI
    if (state.folders.length > 0) {
      const sortedFolders = [...state.folders].sort((a,b)=>(a.order||0)-(b.order||0));
      state.currentFolderId = sortedFolders[0].id;
    }
    renderFolderTabs();
    renderFloorTabs();
    const floorsInFolder = getFloorsInFolder(state.currentFolderId);
    if (floorsInFolder.length > 0) {
      selectFloor(floorsInFolder.sort((a,b)=>(a.order||0)-(b.order||0))[0].id);
    } else {
      showNoPlan();
    }

    _pendingImport = null;
    closeModal('import-modal');
    closeModal('export-modal');
    alert(mode === 'replace' ? '復元が完了しました（上書き）' : '復元が完了しました（マージ）');
  } catch(e) {
    alert('復元に失敗しました: ' + e.message);
  }
}


// ========== RESET ==========
async function resetAllData() {
  if (!confirm('全データ（フォルダ・図面・ピン・写真）を削除して初期化しますか？\nこの操作は元に戻せません。')) return;
  try {
    const db = await openDB();
    db.close();
    _db = null;
    await new Promise((res, rej) => {
      const req = indexedDB.deleteDatabase(DB_NAME); indexedDB.deleteDatabase('inspection_app');
      req.onsuccess = res;
      req.onerror = rej;
    });
    localStorage.clear();
    alert('リセット完了。再読み込みします。');
    location.reload();
  } catch(e) {
    alert('リセット失敗: ' + e.message);
  }
}
