<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場検査">
<meta name="theme-color" content="#1a1a2e">
<title>現場検査アプリ v2</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eaeaea;
    --text2: #8892a4;
    --ok: #2ecc71;
    --ng: #e74c3c;
    --check: #f39c12;
    --pin-size: 32px;
    --radius: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif; }

  #app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }

  /* HEADER */
  header {
    background: var(--surface);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(233,69,96,0.3);
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; flex: 1; }
  .header-btn {
    background: var(--accent2); border: 1px solid var(--accent); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }

  /* FOLDER TABS */
  #folder-tabs {
    display: flex; overflow-x: auto; gap: 6px; padding: 8px 16px;
    background: var(--bg); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    scrollbar-width: none;
  }
  #folder-tabs::-webkit-scrollbar { display: none; }
  .folder-tab {
    flex-shrink: 0; padding: 5px 12px; border-radius: 16px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2); font-size: 12px; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
    transition: all 0.2s;
  }
  .folder-tab.active { background: rgba(233,69,96,0.2); border-color: var(--accent); color: var(--accent); }
  .folder-tab.add-btn { border-style: dashed; color: var(--text2); }
  .folder-tab .folder-del { font-size: 10px; opacity: 0.5; margin-left: 2px; }

  /* FLOOR TABS */
  #floor-tabs {
    display: flex; overflow-x: auto; gap: 8px; padding: 10px 16px;
    background: var(--surface2); flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    scrollbar-width: none;
  }
  #floor-tabs::-webkit-scrollbar { display: none; }
  .floor-tab {
    flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2); font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .floor-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .floor-tab.add-btn { border-style: dashed; color: var(--accent); }

  /* MAIN CONTENT */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* PLAN VIEW */
  #plan-view { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #111; }
  #plan-canvas-wrap {
    position: absolute; transform-origin: 0 0;
    cursor: crosshair;
  }
  #plan-canvas-wrap img {
    display: block; max-width: none; pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  .no-plan {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; color: var(--text2);
  }
  .no-plan-icon { font-size: 64px; opacity: 0.3; }
  .no-plan p { font-size: 15px; }
  .upload-plan-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 12px 24px; border-radius: var(--radius); font-size: 15px; cursor: pointer;
  }

  /* PINS */
  .pin {
    position: absolute; transform: translate(-50%, -100%);
    width: var(--pin-size); cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    z-index: 10; transition: transform 0.15s;
    touch-action: none;
  }
  .pin:active { transform: translate(-50%, -100%) scale(1.2); }
  .pin svg { width: 100%; height: auto; }
  .pin.status-ok svg .pin-fill { fill: var(--ok); }
  .pin.status-ng svg .pin-fill { fill: var(--ng); }
  .pin.status-check svg .pin-fill { fill: var(--check); }
  .pin.status-none svg .pin-fill { fill: var(--accent); }
  .pin-num {
    position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; color: #fff; pointer-events: none;
  }

  /* TOOLBAR */
  #toolbar {
    background: var(--surface); border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px 16px; padding-bottom: calc(10px + var(--safe-bottom));
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .tool-btn {
    flex: 1; padding: 10px 4px; border-radius: 10px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2); font-size: 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all 0.15s;
  }
  .tool-btn .icon { font-size: 20px; }
  .tool-btn.active, .tool-btn:active { background: var(--accent2); border-color: var(--accent); color: var(--accent); }

  /* MODALS */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: flex-end; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom));
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 90vh; overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

  /* PIN DETAIL */
  .pin-photos { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .photo-thumb {
    border-radius: 8px; overflow: hidden; background: var(--surface2);
    position: relative; cursor: pointer;
  }
  .photo-thumb img { width: 100%; height: auto; display: block; max-height: 400px; object-fit: contain; background: #000; }
  .photo-thumb .del-photo {
    position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6);
    border: none; color: #fff; border-radius: 50%; width: 22px; height: 22px;
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .add-photo-btn {
    width: 100%; padding: 14px; border-radius: 8px; background: var(--surface2);
    border: 1px dashed rgba(255,255,255,0.2);
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 8px; color: var(--text2); font-size: 14px; cursor: pointer;
  }
  .add-photo-btn span { font-size: 22px; }

  textarea.memo {
    width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); border-radius: var(--radius); padding: 10px; font-size: 14px;
    min-height: 80px; resize: none; font-family: inherit;
    outline: none;
  }
  textarea.memo:focus { border-color: var(--accent); }

  .status-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .status-chip {
    flex: 1; padding: 8px 4px; border-radius: 8px; text-align: center;
    font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid transparent;
    transition: all 0.15s;
  }
  .status-chip.ok { background: rgba(46,204,113,0.15); color: var(--ok); }
  .status-chip.ng { background: rgba(231,76,60,0.15); color: var(--ng); }
  .status-chip.check { background: rgba(243,156,18,0.15); color: var(--check); }
  .status-chip.selected-ok { border-color: var(--ok); background: rgba(46,204,113,0.3); }
  .status-chip.selected-ng { border-color: var(--ng); background: rgba(231,76,60,0.3); }
  .status-chip.selected-check { border-color: var(--check); background: rgba(243,156,18,0.3); }

  .btn-primary {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 12px;
  }
  .btn_zip {
    width: 100%; padding: 12px; background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }
  .btn-zip {
    width: 100%; padding: 12px; background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }
  .btn-zip:active { border-color: var(--accent); color: var(--accent); }
    width: 100%; padding: 12px; background: transparent; color: var(--ng);
    border: 1px solid var(--ng); border-radius: var(--radius); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }

  /* LIST VIEW */
  #list-view { flex: 1; overflow-y: auto; padding: 12px 16px; display: none; }
  .list-item {
    background: var(--surface); border-radius: var(--radius); padding: 12px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.06);
  }
  .list-pin-badge {
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    flex-shrink: 0;
  }
  .badge-ok { background: rgba(46,204,113,0.2); color: var(--ok); }
  .badge-ng { background: rgba(231,76,60,0.2); color: var(--ng); }
  .badge-check { background: rgba(243,156,18,0.2); color: var(--check); }
  .badge-none { background: rgba(233,69,96,0.2); color: var(--accent); }
  .list-item-info { flex: 1; min-width: 0; }
  .list-item-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .list-item-sub { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-photo-count { font-size: 12px; color: var(--text2); flex-shrink: 0; }

  /* FLOOR MODAL */
  .input-field {
    width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); border-radius: var(--radius); padding: 12px; font-size: 15px;
    outline: none; font-family: inherit; margin-bottom: 12px;
  }
  .input-field:focus { border-color: var(--accent); }

  /* PHOTO VIEWER */
  #photo-viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    z-index: 200; display: none;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #photo-viewer.open { display: block; }
  #viewer-stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #photo-viewer img {
    max-width: 100%;
    max-height: calc(100vh - 80px);
    object-fit: contain;
    transform-origin: 0 0;
    will-change: transform;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #photo-viewer .close-viewer {
    position: absolute; top: calc(16px + var(--safe-top)); right: 16px;
    background: rgba(255,255,255,0.4); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer;
    z-index: 10;
  }
  #viewer-hint {
    position: absolute; bottom: calc(20px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.7);
    font-size: 11px; padding: 6px 14px; border-radius: 20px;
    pointer-events: none; transition: opacity 0.5s; white-space: nowrap;
    z-index: 10;
  }

  /* FLOATING CAMERA BUTTON */
  #float-camera-btn {
    position: fixed;
    bottom: calc(90px + var(--safe-bottom));
    right: 20px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    border: none; color: #fff;
    font-size: 26px;
    box-shadow: 0 4px 16px rgba(233,69,96,0.5);
    cursor: pointer;
    z-index: 150;
    display: none;
    align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  #float-camera-btn:active { transform: scale(0.9); }

  .btn-camera {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 14px;
    font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  /* CROP BUTTONS */
  .crop-btn {
    flex:1; padding:8px 4px; border-radius:8px; font-size:13px; font-weight:600;
    background:var(--surface2); border:1px solid rgba(255,255,255,0.1);
    color:var(--text2); cursor:pointer; transition:all 0.15s;
  }
  .crop-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* EXPORT MENU */
  .export-menu-btn {
    width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); padding: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; color: var(--text);
    margin-bottom: 10px; text-align: left; transition: border-color 0.15s;
  }
  .export-menu-btn:active { border-color: var(--accent); background: var(--accent2); }
  .export-icon { font-size: 28px; flex-shrink: 0; }
  .export-btn-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .export-btn-sub { font-size: 12px; color: var(--text2); }

  /* ASPECT RATIO BUTTONS */
  .aspect-btn {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); padding: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; color: var(--text);
    transition: border-color 0.15s;
  }
  .aspect-btn:active { border-color: var(--accent); background: var(--accent2); }
  .aspect-preview {
    width: 80px; background: var(--surface); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .aspect-preview span { font-size: 12px; font-weight: 700; color: var(--accent); }
  .aspect-label { font-size: 15px; font-weight: 500; }
  .zoom-hint {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.6);
    font-size: 11px; padding: 4px 10px; border-radius: 20px; pointer-events: none;
    transition: opacity 0.5s; white-space: nowrap;
  }

  /* Summary bar */
  #summary-bar {
    background: var(--surface2); padding: 8px 16px;
    display: flex; gap: 12px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .summary-item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .summary-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📐 現場検査</h1>
    <button class="header-btn" onclick="showAddMenu()">＋ 追加</button>
  </header>

  <!-- フォルダ行 -->
  <div id="folder-tabs"></div>
  <!-- 図面行 -->
  <div id="floor-tabs"></div>

  <div id="summary-bar">
    <div class="summary-item"><div class="summary-dot" style="background:var(--accent)"></div><span id="sum-total">0件</span></div>
    <div class="summary-item"><div class="summary-dot" style="background:var(--ok)"></div><span id="sum-ok">OK: 0</span></div>
    <div class="summary-item"><div class="summary-dot" style="background:var(--ng)"></div><span id="sum-ng">NG: 0</span></div>
    <div class="summary-item"><div class="summary-dot" style="background:var(--check)"></div><span id="sum-check">確認: 0</span></div>
  </div>

  <div id="main">
    <div id="plan-view">
      <div id="plan-canvas-wrap">
        <img id="plan-img" src="" alt="図面">
        <div id="pins-layer"></div>
      </div>
      <div class="no-plan" id="no-plan-msg">
        <div class="no-plan-icon">📋</div>
        <p id="no-plan-text">まずフォルダを追加してください</p>
        <button class="upload-plan-btn" id="no-plan-btn" onclick="showAddMenu()" ontouchend="showAddMenu()">＋ 追加する</button>
      </div>
      <div class="zoom-hint" id="zoom-hint">1本指でピン追加 / 2本指で移動・拡大</div>
    </div>
    <div id="list-view"></div>
  </div>

  <div id="toolbar">
    <button class="tool-btn active" id="btn-pin-mode" onclick="setMode('pin')">
      <span class="icon">📍</span><span>ピン追加</span>
    </button>
    <button class="tool-btn" id="btn-move-mode" onclick="setMode('move')">
      <span class="icon">✋</span><span>移動</span>
    </button>
    <button class="tool-btn" id="btn-list-mode" onclick="setMode('list')">
      <span class="icon">📋</span><span>一覧</span>
    </button>
    <button class="tool-btn" id="btn-export" onclick="openModal('export-modal')">
      <span class="icon">📤</span><span>エクスポート</span>
    </button>
  </div>
</div>

<!-- Add Menu Modal -->
<div class="modal-overlay" id="add-menu-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">＋ 追加</div>
    <button class="export-menu-btn" ontouchend="closeModal('add-menu-modal');showFolderModal()" onclick="closeModal('add-menu-modal');showFolderModal()">
      <span class="export-icon">📁</span>
      <div><div class="export-btn-title">フォルダを追加</div><div class="export-btn-sub">図面をまとめるフォルダを作成</div></div>
    </button>
    <button class="export-menu-btn" ontouchend="closeModal('add-menu-modal');showFloorModal()" onclick="closeModal('add-menu-modal');showFloorModal()">
      <span class="export-icon">📋</span>
      <div><div class="export-btn-title">図面を追加</div><div class="export-btn-sub">PDF/画像をアップロード</div></div>
    </button>
    <button class="btn-danger" ontouchend="closeModal('add-menu-modal')" onclick="closeModal('add-menu-modal')">キャンセル</button>
  </div>
</div>

<!-- Folder Modal -->
<div class="modal-overlay" id="folder-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📁 フォルダを追加</div>
    <input class="input-field" type="text" autocomplete="off" id="folder-name-input" placeholder="フォルダ名（例：A棟、1工区）">
    <button class="btn-primary" ontouchend="saveFolder()" onclick="saveFolder()">追加する</button>
    <button class="btn-danger" ontouchend="closeModal('folder-modal')" onclick="closeModal('folder-modal')">キャンセル</button>
  </div>
</div>

<!-- Rename Folder Modal -->
<div class="modal-overlay" id="rename-folder-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ フォルダ名を変更</div>
    <input class="input-field" type="text" autocomplete="off" id="rename-folder-input" placeholder="フォルダ名">
    <button class="btn-primary" ontouchend="saveRenameFolder()" onclick="saveRenameFolder()">変更する</button>
    <button class="btn-danger" ontouchend="closeModal('rename-folder-modal')" onclick="closeModal('rename-folder-modal')">キャンセル</button>
  </div>
</div>

<!-- Rename Floor Modal -->
<div class="modal-overlay" id="rename-floor-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 図面名を変更</div>
    <input class="input-field" type="text" autocomplete="off" id="rename-floor-input" placeholder="図面名">
    <button class="btn-primary" ontouchend="saveRenameFloor()" onclick="saveRenameFloor()">変更する</button>
    <button class="btn-danger" onclick="closeModal('rename-floor-modal')">キャンセル</button>
  </div>
</div>

<!-- Floor Modal -->
<div class="modal-overlay" id="floor-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="floor-modal-title">図面を追加</div>
    <input class="input-field" type="text" autocomplete="off" id="floor-name-input" placeholder="図面名（例：1F 平面図）">
    <select class="input-field" id="floor-folder-select" style="cursor:pointer"></select>
    <button class="btn-primary" style="margin-top:0;margin-bottom:12px" id="floor-file-btn">
      📁 画像/PDFを選択
    </button>
    <div id="floor-preview-wrap" style="display:none; margin-bottom:12px">
      <img id="floor-preview" style="width:100%; border-radius:8px; max-height:200px; object-fit:contain; background:#111">
    </div>
    <button class="btn-primary" id="floor-modal-save-btn">追加する</button>

<script>
// ========== STATE ==========
let state = {
  folders: [], // [{id, name, order}]
  floors: [],  // [{id, name, folderId, order, imageData, pins:[]}]
  currentFolderId: null,
  currentFloorId: null,
  mode: 'pin',
  editingPinId: null,
  pendingPhotoForPin: null,
  pendingAspect: '4:3',
};

let transform = { x: 0, y: 0, scale: 1 };
let gesture = { fingers: 0, startDist: 0, startScale: 1, startX: 0, startY: 0, startTX: 0, startTY: 0, midX: 0, midY: 0, moved: false, startTime: 0 };

const DB_NAME = 'inspection_app_v2';
const DB_VERSION = 1;
const STORE_FLOORS = 'floors';
const STORE_FOLDERS = 'folders';
const LS_KEY = 'inspection_app_v3';

let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_FLOORS)) {
        db.createObjectStore(STORE_FLOORS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORE_FOLDERS)) {
        db.createObjectStore(STORE_FOLDERS, { keyPath: 'id' });
      }

    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e.target.error);
  });
}

async function save() {
  try {
    const db = await openDB();

    // Save folders
    const ftx = db.transaction(STORE_FOLDERS, 'readwrite');
    const fstore = ftx.objectStore(STORE_FOLDERS);
    for (const folder of state.folders) fstore.put(folder);
    const fkeys = await new Promise((res,rej) => { const r=fstore.getAllKeys(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    const fids = new Set(state.folders.map(f=>f.id));
    for (const k of fkeys) if (!fids.has(k)) fstore.delete(k);
    await new Promise((res,rej) => { ftx.oncomplete=res; ftx.onerror=()=>rej(ftx.error); });

    // Save floors
    const tx = db.transaction(STORE_FLOORS, 'readwrite');
    const store = tx.objectStore(STORE_FLOORS);
    for (const floor of state.floors) store.put(floor);
    const allKeys = await new Promise((res,rej) => { const r=store.getAllKeys(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    const currentIds = new Set(state.floors.map(f=>f.id));
    for (const key of allKeys) if (!currentIds.has(key)) store.delete(key);
    await new Promise((res,rej) => { tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  } catch(e) {
    console.error('Save error:', e);
    alert('保存に失敗しました: ' + e.message);
  }
}

async function load() {
  try {
    const db = await openDB();

    // Load folders
    const ftx = db.transaction(STORE_FOLDERS, 'readonly');
    const folders = await new Promise((res,rej) => { const r=ftx.objectStore(STORE_FOLDERS).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    state.folders = folders || [];

    // Load floors
    const tx = db.transaction(STORE_FLOORS, 'readonly');
    const floors = await new Promise((res,rej) => { const r=tx.objectStore(STORE_FLOORS).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

    if (floors && floors.length > 0) {
      state.floors = floors;
      // 古いデータにorderがなければ付与
      state.floors.forEach((f,i) => { if (f.order===undefined) f.order=i; });
      state.folders.forEach((f,i) => { if (f.order===undefined) f.order=i; });

      return;
    }

    // localStorageから移行
    const lsData = localStorage.getItem(LS_KEY);
    if (lsData) {
      const parsed = JSON.parse(lsData);
      if (parsed && parsed.length > 0) {
        const def = { id: 'folder_default', name: 'メイン', order: 0 };
        state.folders = [def];
        state.floors = parsed.map((f,i) => ({ ...f, folderId: def.id, order: i }));
        await save();
        localStorage.removeItem(LS_KEY);
      }
    }

  } catch(e) {
    console.error('Load error:', e);
    try {
      const lsData = localStorage.getItem(LS_KEY);
      if (lsData) state.floors = JSON.parse(lsData);
    } catch(e2) {}
  }
}

async function init() {
  await load();
  fixOrphanedFloors();
  await save(); // 修正したfolderIdを保存
  if (state.folders.length > 0) {
    state.currentFolderId = state.folders.sort((a,b)=>a.order-b.order)[0].id;
  }
  renderFolderTabs();
  renderFloorTabs();
  const floorsInFolder = getFloorsInFolder(state.currentFolderId);
  if (floorsInFolder.length > 0) {
    selectFloor(floorsInFolder.sort((a,b)=>(a.order||0)-(b.order||0))[0].id);
  } else {
    showNoPlan();
  }
  setupGestures();
  setTimeout(() => {
    document.getElementById('zoom-hint').style.opacity = '0';
  }, 3000);

}

// ========== FOLDERS ==========
function getFloorsInFolder(folderId) {
  return state.floors.filter(f => f.folderId === folderId);
}

function fixOrphanedFloors() {
  // folderIdがない、またはフォルダが存在しない図面をデフォルトフォルダに割り当て
  const folderIds = new Set(state.folders.map(f => f.id));
  const defaultId = state.folders.length > 0 ? state.folders.sort((a,b)=>a.order-b.order)[0].id : null;
  if (!defaultId) return;
  state.floors.forEach(f => {
    if (!f.folderId || !folderIds.has(f.folderId)) {
      f.folderId = defaultId;
    }
  });
}

function showAddMenu() { openModal('add-menu-modal'); }

function showFolderModal() {
  document.getElementById('folder-name-input').value = '';
  openModal('folder-modal');
}

function saveFolder() {
  const name = document.getElementById('folder-name-input').value.trim();
  if (!name) { alert('フォルダ名を入力してください'); return; }
  const folder = { id: 'folder_' + Date.now(), name, order: state.folders.length };
  state.folders.push(folder);
  save();
  state.currentFolderId = folder.id;
  renderFolderTabs();
  renderFloorTabs();
  closeModal('folder-modal');
}

function selectFolder(id) {
  state.currentFolderId = id;
  const floors = getFloorsInFolder(id).sort((a,b)=>(a.order||0)-(b.order||0));
  renderFolderTabs();
  renderFloorTabs();
  if (floors.length > 0) {
    selectFloor(floors[0].id);
  } else {
    state.currentFloorId = null;
    showNoPlan();
    updateSummary();
  }
}

function renderFolderTabs() {
  const tabs = document.getElementById('folder-tabs');
  tabs.innerHTML = '';
  const sorted = [...state.folders].sort((a,b)=>a.order-b.order);

  sorted.forEach(folder => {
    const tab = document.createElement('div');
    tab.className = 'folder-tab' + (folder.id === state.currentFolderId ? ' active' : '');
    tab.dataset.folderId = folder.id;

    const label = document.createElement('span');
    label.textContent = '📁 ' + folder.name;
    label.style.cursor = 'pointer';

    label.addEventListener('click', () => selectFolder(folder.id));
    label.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); selectFolder(folder.id); });

    const delBtn = document.createElement('span');
    delBtn.className = 'folder-del';
    delBtn.textContent = '✕';
    delBtn.style.cursor = 'pointer';
    delBtn.addEventListener('click', e => { e.stopPropagation(); confirmDeleteFolder(folder.id); });
    delBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); confirmDeleteFolder(folder.id); });

    tab.appendChild(label);
    tab.appendChild(delBtn);
    tabs.appendChild(tab);

    setupFolderDrag(tab, folder);
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'folder-tab add-btn';
  addBtn.textContent = '＋ フォルダ';
  addBtn.onclick = showFolderModal;
  tabs.appendChild(addBtn);
}

function setupFolderDrag(el, folder) {
  let longTimer = null, dragging = false, startX = 0, clone = null;
  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    longTimer = setTimeout(() => {
      dragging = true;
      el.style.opacity = '0.5';
    }, 600);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!dragging) { clearTimeout(longTimer); return; }
    const x = e.touches[0].clientX;
    const tabs = document.getElementById('folder-tabs');
    const children = [...tabs.querySelectorAll('.folder-tab:not(.add-btn)')];
    children.forEach(c => {
      const rect = c.getBoundingClientRect();
      if (x > rect.left && x < rect.right && c !== el) {
        const otherFolder = state.folders.find(f => f.id === c.dataset.folderId);
        if (otherFolder) {
          const tmp = folder.order; folder.order = otherFolder.order; otherFolder.order = tmp;
          renderFolderTabs();
        }
      }
    });
  }, { passive: true });
  el.addEventListener('touchend', () => {
    clearTimeout(longTimer);
    if (dragging) { dragging = false; el.style.opacity = ''; save(); }
  });
}

function renameFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  document.getElementById('rename-folder-input').value = folder.name;
  window._renamingFolderId = id;
  openModal('rename-folder-modal');
  setTimeout(() => document.getElementById('rename-folder-input').focus(), 300);
}

function saveRenameFolder() {
  const folder = state.folders.find(f => f.id === window._renamingFolderId);
  if (!folder) return;
  const name = document.getElementById('rename-folder-input').value.trim();
  if (!name) return;
  folder.name = name;
  save();
  renderFolderTabs();
  closeModal('rename-folder-modal');
}

function confirmDeleteFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  const floorCount = getFloorsInFolder(id).length;
  if (!confirm(`「${folder.name}」を削除しますか？\n中の図面${floorCount}件もすべて削除されます。`)) return;
  state.floors = state.floors.filter(f => f.folderId !== id);
  state.folders = state.folders.filter(f => f.id !== id);
  save();
  if (state.folders.length > 0) selectFolder(state.folders[0].id);
  else { state.currentFolderId = null; state.currentFloorId = null; renderFolderTabs(); renderFloorTabs(); showNoPlan(); }
}

// ========== FLOORS ==========
function showFloorModal() {
  document.getElementById('floor-name-input').value = '';
  document.getElementById('floor-preview-wrap').style.display = 'none';
  document.getElementById('floor-file-input').value = '';
  document.getElementById('floor-modal-title').textContent = '図面を追加';
  window._pendingFloorDataUrl = null;
  window._replacingFloorId = null;
  // ファイル選択ボタン
  const fileBtn = document.getElementById('floor-file-btn');
  fileBtn.onclick = () => document.getElementById('floor-file-input').click();
  // 保存ボタン
  const saveBtn = document.getElementById('floor-modal-save-btn');
  saveBtn.textContent = '追加する';
  saveBtn.onclick = saveFloor;
  // フォルダ選択肢
  const sel = document.getElementById('floor-folder-select');
  sel.innerHTML = state.folders.map(f => `<option value="${f.id}" ${f.id===state.currentFolderId?'selected':''}>${f.name}</option>`).join('');
  openModal('floor-modal');
}

function showReplaceFloorModal(floorId) {
  const floor = getFloor(floorId);
  if (!floor) return;
  document.getElementById('floor-name-input').value = floor.name;
  document.getElementById('floor-preview-wrap').style.display = 'none';
  document.getElementById('floor-file-input').value = '';
  document.getElementById('floor-modal-title').textContent = '図面を差し替え・名前変更';
  window._pendingFloorDataUrl = null;
  window._replacingFloorId = floorId;
  // ファイル選択ボタン
  const fileBtn = document.getElementById('floor-file-btn');
  fileBtn.onclick = () => document.getElementById('floor-file-input').click();
  // 保存ボタン
  const saveBtn = document.getElementById('floor-modal-save-btn');
  saveBtn.textContent = '変更する';
  saveBtn.onclick = () => replaceFloor(floorId);
  // フォルダ選択肢
  const sel = document.getElementById('floor-folder-select');
  sel.innerHTML = state.folders.map(f => `<option value="${f.id}" ${f.id===floor.folderId?'selected':''}>${f.name}</option>`).join('');
  openModal('floor-modal');
}

function replaceFloor(floorId) {
  const floor = getFloor(floorId);
  if (!floor) return;
  const name = document.getElementById('floor-name-input').value.trim() || floor.name;
  const folderId = document.getElementById('floor-folder-select').value;
  floor.name = name;
  floor.folderId = folderId;
  if (window._pendingFloorDataUrl) {
    floor.imageData = window._pendingFloorDataUrl; // 画像差し替え（ピン・写真はそのまま）
  }
  save();
  renderFolderTabs();
  renderFloorTabs();
  if (state.currentFloorId === floorId) loadFloorImage(floor);
  closeModal('floor-modal');
}

function saveFloor() {
  const name = document.getElementById('floor-name-input').value.trim() || '図面 ' + (state.floors.length + 1);
  const folderId = document.getElementById('floor-folder-select').value || state.currentFolderId;
  if (!window._pendingFloorDataUrl) {
    alert('図面ファイルが読み込まれていません。\nPDFはEdgeでブロックされる場合があります。\nJPGまたはPNG画像をお使いください。');
    return;
  }
  if (!folderId) {
    alert('フォルダが選択されていません。');
    return;
  }
  const floor = {
    id: 'f_' + Date.now(),
    name,
    folderId,
    order: getFloorsInFolder(folderId).length,
    imageData: window._pendingFloorDataUrl,
    pins: [],
    createdAt: new Date().toISOString(),
  };
  state.floors.push(floor);
  save();
  state.currentFolderId = folderId;
  renderFolderTabs();
  renderFloorTabs();
  selectFloor(floor.id);
  closeModal('floor-modal');
}

function selectFloor(id) {
  state.currentFloorId = id;
  const floor = getFloor(id);
  renderFloorTabs();
  if (floor) loadFloorImage(floor);
  if (state.mode === 'list') renderListView();
  updateSummary();
}

function getFloor(id) {
  return state.floors.find(f => f.id === id);
}

function loadFloorImage(floor) {
  const img = document.getElementById('plan-img');
  const noPlan = document.getElementById('no-plan-msg');
  img.onload = function() {
    noPlan.style.display = 'none';
    const view = document.getElementById('plan-view');
    const vw = view.offsetWidth, vh = view.offsetHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.min(vw / iw, vh / ih, 1);
    transform = { x: (vw - iw * scale) / 2, y: (vh - ih * scale) / 2, scale };
    applyTransform();
    renderPins();
  };
  img.src = floor.imageData;
  noPlan.style.display = 'none';
}

function showNoPlan() {
  document.getElementById('no-plan-msg').style.display = 'flex';
  document.getElementById('plan-img').src = '';
  document.getElementById('pins-layer').innerHTML = '';

function confirmDeleteFloor(id) {
  const floor = getFloor(id);
  if (!floor) return;
  const pinCount = floor.pins.length;
  const photoCount = floor.pins.reduce((s, p) => s + p.photos.length, 0);
  if (!confirm(`「${floor.name}」を削除しますか？\nピン${pinCount}件・写真${photoCount}枚がすべて削除されます。`)) return;
  state.floors = state.floors.filter(f => f.id !== id);
  save();
  const remaining = getFloorsInFolder(state.currentFolderId).sort((a,b)=>a.order-b.order);
  if (remaining.length > 0) selectFloor(remaining[0].id);
  else { state.currentFloorId = null; showNoPlan(); renderFloorTabs(); updateSummary(); }
}

function renderFloorTabs() {
  const tabs = document.getElementById('floor-tabs');
  tabs.innerHTML = '';
  const floors = getFloorsInFolder(state.currentFolderId).sort((a,b)=>a.order-b.order);

  floors.forEach(f => {
    const tab = document.createElement('div');
    tab.className = 'floor-tab' + (f.id === state.currentFloorId ? ' active' : '');
    tab.style.display = 'flex'; tab.style.alignItems = 'center'; tab.style.gap = '6px';
    tab.dataset.floorId = f.id;

    const label = document.createElement('span');
    label.textContent = f.name;
    label.style.cursor = 'pointer';
    label.addEventListener('click', () => selectFloor(f.id));
    label.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); selectFloor(f.id); });

    const replaceBtn = document.createElement('span');
    replaceBtn.textContent = '🔄';
    replaceBtn.title = '図面を差し替え・名前変更';
    replaceBtn.style.cssText = 'font-size:11px;cursor:pointer;opacity:0.6;';
    replaceBtn.onclick = e => { e.stopPropagation(); showReplaceFloorModal(f.id); };
    replaceBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); showReplaceFloorModal(f.id); });

    const delBtn = document.createElement('span');

    delBtn.onclick = e => { e.stopPropagation(); confirmDeleteFloor(f.id); };
    delBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); confirmDeleteFloor(f.id); });

    tab.appendChild(label);

    setupFloorDrag(tab, f);

  addBtn.textContent = '＋ 図面追加';
  addBtn.onclick = showFloorModal;
  addBtn.addEventListener('touchend', e => { e.preventDefault(); showFloorModal(); });

function setupFloorDrag(el, floor) {
  let longTimer = null, dragging = false;
  el.addEventListener('touchstart', e => {
    longTimer = setTimeout(() => { dragging = true; el.style.opacity = '0.5'; }, 600);
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!dragging) { clearTimeout(longTimer); return; }
    const x = e.touches[0].clientX;
    const tabs = document.getElementById('floor-tabs');
    const children = [...tabs.querySelectorAll('.floor-tab:not(.add-btn)')];
    children.forEach(c => {
      const rect = c.getBoundingClientRect();
      if (x > rect.left && x < rect.right && c !== el) {
        const otherFloor = state.floors.find(f => f.id === c.dataset.floorId);
        if (otherFloor) {
          const tmp = floor.order; floor.order = otherFloor.order; otherFloor.order = tmp;
          renderFloorTabs();
        }
      }
    });
  }, { passive: true });
  el.addEventListener('touchend', () => {
    clearTimeout(longTimer);
    if (dragging) { dragging = false; el.style.opacity = ''; save(); }
  });
}
function handleFloorFile(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.type === 'application/pdf') {
    // PDFをObjectURLでiframe表示してCanvasにキャプチャ
    renderPDFToImage(file);
  } else {
    const reader = new FileReader();
    reader.onload = function(e) {
      window._pendingFloorDataUrl = e.target.result;
      const preview = document.getElementById('floor-preview');
      const wrap = document.getElementById('floor-preview-wrap');
      if (preview) preview.src = e.target.result;
      if (wrap) wrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

function renderPDFToImage(file) {
  const btn = document.getElementById('floor-file-btn');
  const wrap = document.getElementById('floor-preview-wrap');
  const preview = document.getElementById('floor-preview');
  btn.textContent = '⏳ PDF読み込み中...';
  btn.disabled = true;

  const tryPdfJs = (src, workerSrc) => {
    return new Promise((resolve, reject) => {
      if (typeof pdfjsLib !== 'undefined') {
        resolve(pdfjsLib);
        return;
      }
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => {
        if (typeof pdfjsLib !== 'undefined') {
          pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;
          resolve(pdfjsLib);
        } else reject(new Error('pdfjsLib not found'));
      };
      s.onerror = () => reject(new Error('Script load failed: ' + src));
      document.head.appendChild(s);
    });
  };

  const cdnList = [
    ['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
     'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
     'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
    ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
     'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  ];

  const tryNext = async (index) => {
    if (index >= cdnList.length) {
      btn.textContent = '📁 画像/PDFを選択';
      btn.disabled = false;
      alert('PDFの読み込みに失敗しました。\nネットワーク環境を確認するか、JPG/PNG画像をお試しください。');
      return;
    }
    try {
      const [src, workerSrc] = cdnList[index];
      const lib = await tryPdfJs(src, workerSrc);
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await lib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      window._pendingFloorDataUrl = dataUrl;
      if (preview) { preview.src = dataUrl; }
      if (wrap) wrap.style.display = 'block';
      btn.textContent = '✅ PDF読み込み完了（再選択する場合はタップ）';
      btn.disabled = false;
      btn.onclick = () => document.getElementById('floor-file-input').click();
    } catch(e) {
      console.warn('PDF CDN failed:', cdnList[index][0], e.message);
      tryNext(index + 1);
    }
  };

  tryNext(0);
}

const PIN_COLORS = [
  '#e94560', '#2ecc71', '#e74c3c', '#3498db', '#f39c12',
  '#9b59b6', '#1abc9c', '#e67e22', '#ffffff', '#f1c40f'
];

function renderPins() {
  const floor = getFloor(state.currentFloorId);
  if (!floor) return;
  const layer = document.getElementById('pins-layer');
  const img = document.getElementById('plan-img');
  layer.innerHTML = '';
  layer.style.position = 'absolute';
  layer.style.left = '0'; layer.style.top = '0';
  layer.style.width = img.naturalWidth + 'px';
  layer.style.height = img.naturalHeight + 'px';

  floor.pins.forEach(pin => {
    const el = document.createElement('div');
    el.className = 'pin status-' + pin.status;
    el.style.left = (pin.x * img.naturalWidth) + 'px';
    el.style.top = (pin.y * img.naturalHeight) + 'px';
    const pinColor = pin.color || null;
    el.innerHTML = `
      <svg viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">
        <path class="pin-fill" d="M16 0C9.4 0 4 5.4 4 12c0 9 12 28 12 28S28 21 28 12C28 5.4 22.6 0 16 0z" ${pinColor ? `style="fill:${pinColor}"` : ''}/>
        <circle cx="16" cy="12" r="6" fill="rgba(0,0,0,0.25)"/>
      </svg>
      <div class="pin-num">${pin.num}</div>
    `;
    el.addEventListener('click', e => { e.stopPropagation(); });
    el.addEventListener('touchstart', e => {
      e.stopPropagation();
      gesture.moved = true;

      const touch = e.touches[0];
      let dragging = false;
      let longPressTimer = null;

      // 長押し判定（500ms）
      longPressTimer = setTimeout(() => {
        dragging = true;
        el.style.opacity = '0.7';
        el.style.transform = 'translate(-50%, -100%) scale(1.3)';
        el.style.zIndex = '50';
      }, 500);

      const onMove = (ev) => {
        if (!dragging) {
          // 少し動いたら長押しキャンセル
          const dx = ev.touches[0].clientX - touch.clientX;
          const dy = ev.touches[0].clientY - touch.clientY;
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
            clearTimeout(longPressTimer);
          }
          return;
        }
        ev.stopPropagation();
        const img = document.getElementById('plan-img');
        const view = document.getElementById('plan-view');
        const rect = view.getBoundingClientRect();
        const imgX = (ev.touches[0].clientX - rect.left - transform.x) / transform.scale;
        const imgY = (ev.touches[0].clientY - rect.top - transform.y) / transform.scale;
        const xPct = Math.max(0, Math.min(1, imgX / img.naturalWidth));
        const yPct = Math.max(0, Math.min(1, imgY / img.naturalHeight));
        pin.x = xPct;
        pin.y = yPct;
        el.style.left = (xPct * img.naturalWidth) + 'px';
        el.style.top = (yPct * img.naturalHeight) + 'px';
      };

      const onEnd = (ev) => {
        clearTimeout(longPressTimer);
        el.removeEventListener('touchmove', onMove);
        el.removeEventListener('touchend', onEnd);
        el.style.opacity = '';
        el.style.transform = '';
        el.style.zIndex = '';
        if (dragging) {
          save();
          dragging = false;
        } else {
          // 短いタップ → 詳細を開く
          openPinDetail(pin.id);
        }
      };

      el.addEventListener('touchmove', onMove, { passive: true });
      el.addEventListener('touchend', onEnd);
    }, { passive: true });
    layer.appendChild(el);
  });
}

// ========== PHOTO CAPTURE ==========
function handleCameraCapture(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const pinId = state.pendingPhotoForPin;
  const floorId = state.currentFloorId;
  const aspect = state.pendingAspect || '4:3';

  if (!pinId) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // トリミング計算
      let sx = 0, sy = 0, cw = img.width, ch = img.height;
      const r = aspect === '16:9' ? 16/9 : 4/3;
      if (img.width / img.height > r) {
        cw = Math.round(img.height * r);
        sx = Math.round((img.width - cw) / 2);
      } else {
        ch = Math.round(img.width / r);
        sy = Math.round((img.height - ch) / 2);
      }
      const max = 1280;
      let dw = cw, dh = ch;
      if (dw > max) { dh = Math.round(dh * max / dw); dw = max; }
      if (dh > max) { dw = Math.round(dw * max / dh); dh = max; }

      const canvas = document.createElement('canvas');
      canvas.width = dw; canvas.height = dh;
      canvas.getContext('2d').drawImage(img, sx, sy, cw, ch, 0, 0, dw, dh);
      const data = canvas.toDataURL('image/jpeg', 0.75);

      // 直接保存
      const floor = getFloor(floorId) || state.floors.find(f => f.pins && f.pins.some(p => p.id === pinId));
      if (!floor) return;
      const pin = floor.pins.find(p => p.id === pinId);
      if (!pin) return;

      if (!pin.photos) pin.photos = [];
      pin.photos.push(data);
      if (!pin.aspect) pin.aspect = aspect;
      state.currentFloorId = floor.id;
      _editingPin = pin;
      save();

      // 表示更新
      renderPinPhotos(pin);
      document.getElementById('pin-modal-title').textContent = '📍 ピン #' + pin.num;
      document.getElementById('btn-pin-zip').style.display = 'block';
      if (!document.getElementById('pin-modal').classList.contains('open')) {
        openModal('pin-modal');
        document.getElementById('float-camera-btn').style.display = 'flex';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}


function savePinDetail() {

  _editingPin.memo = document.getElementById('pin-memo').value;

  renderPins();
  updateSummary();

  floor.pins = floor.pins.filter(p => p.id !== _editingPin.id);

// ========== LIST VIEW ==========

  const container = document.getElementById('list-view');

}

function statusLabel(s) {

}

// ========== SUMMARY ==========
function updateSummary() {
  const floor = getFloor(state.currentFloorId);
  if (!floor) {
    document.getElementById('sum-total').textContent = '0件';
    document.getElementById('sum-ok').textContent = 'OK: 0';
    document.getElementById('sum-ng').textContent = 'NG: 0';
    document.getElementById('sum-check').textContent = '確認: 0';

  document.getElementById('sum-ok').textContent = 'OK: ' + pins.filter(p=>p.status==='ok').length;
  document.getElementById('sum-ng').textContent = 'NG: ' + pins.filter(p=>p.status==='ng').length;

// ========== MODE ==========
function setMode(mode) {
  state.mode = mode;
  ['pin','move','list'].forEach(m => {
    document.getElementById('btn-' + m + '-mode').classList.toggle('active', m === mode);
  });

  const listView = document.getElementById('list-view');

    planView.style.display = 'none';

    listView.style.display = 'none';

  }
}

// ========== TRANSFORM ==========
function applyTransform() {
  const wrap = document.getElementById('plan-canvas-wrap');
  wrap.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
}

function setupGestures() {
  const view = document.getElementById('plan-view');

  view.addEventListener('touchstart', onTouchStart, { passive: false });
  view.addEventListener('touchmove', onTouchMove, { passive: false });
  view.addEventListener('touchend', onTouchEnd, { passive: false });
  view.addEventListener('click', onClick);
}

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    gesture.fingers = 1;
    gesture.startX = e.touches[0].clientX;
    gesture.startY = e.touches[0].clientY;
    gesture.startTX = transform.x;
    gesture.startTY = transform.y;
    gesture.moved = false;
  } else if (e.touches.length === 2) {
    gesture.fingers = 2;
    gesture.startDist = getTouchDist(e.touches);
    gesture.startScale = transform.scale;
    gesture.midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    gesture.midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    gesture.startTX = transform.x;
    gesture.startTY = transform.y;
    gesture.moved = true;
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = getTouchDist(e.touches);
    const newScale = Math.max(0.3, Math.min(5, gesture.startScale * dist / gesture.startDist));
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const viewRect = document.getElementById('plan-view').getBoundingClientRect();
    const pivotX = cx - viewRect.left;
    const pivotY = cy - viewRect.top;
    const startPivotX = gesture.midX - viewRect.left;
    const startPivotY = gesture.midY - viewRect.top;
    transform.x = gesture.startTX + (pivotX - startPivotX) + (startPivotX - gesture.startTX) * (1 - newScale / gesture.startScale);
    transform.y = gesture.startTY + (pivotY - startPivotY) + (startPivotY - gesture.startTY) * (1 - newScale / gesture.startScale);
    transform.scale = newScale;
    applyTransform();
    gesture.moved = true;
  } else if (e.touches.length === 1 && gesture.fingers === 1) {
    const dx = e.touches[0].clientX - gesture.startX;
    const dy = e.touches[0].clientY - gesture.startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) gesture.moved = true;
    if (state.mode === 'move' && gesture.moved) {
      transform.x = gesture.startTX + dx;
      transform.y = gesture.startTY + dy;
      applyTransform();
    }
  }
}

function onTouchEnd(e) {
  if (e.touches.length === 0) {
    if (gesture.fingers === 1 && !gesture.moved && state.mode === 'pin') {
      const floor = getFloor(state.currentFloorId);
      if (floor && floor.imageData) {
        const view = document.getElementById('plan-view');
        const img = document.getElementById('plan-img');
        const rect = view.getBoundingClientRect();
        const touch = e.changedTouches[0];
        const imgX = (touch.clientX - rect.left - transform.x) / transform.scale;
        const imgY = (touch.clientY - rect.top - transform.y) / transform.scale;
        const xPct = imgX / img.naturalWidth;
        const yPct = imgY / img.naturalHeight;
        if (xPct >= 0 && xPct <= 1 && yPct >= 0 && yPct <= 1) {
          createPin(xPct, yPct);
        }
      }
    }
    gesture.fingers = 0;
    gesture.moved = false;
  } else if (e.touches.length === 1) {
    gesture.fingers = 1;
    gesture.startX = e.touches[0].clientX;
    gesture.startY = e.touches[0].clientY;
    gesture.startTX = transform.x;
    gesture.startTY = transform.y;
    gesture.moved = true;
  }
}

function onClick(e) {
  // PCマウス用（タッチはonTouchEndで処理）
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  if (state.mode !== 'pin') return;
  if (gesture.moved) return;
  const floor = getFloor(state.currentFloorId);
  if (!floor || !floor.imageData) return;
  const view = document.getElementById('plan-view');
  const img = document.getElementById('plan-img');
  const rect = view.getBoundingClientRect();
  const imgX = (e.clientX - rect.left - transform.x) / transform.scale;
  const imgY = (e.clientY - rect.top - transform.y) / transform.scale;
  const xPct = imgX / img.naturalWidth;
  const yPct = imgY / img.naturalHeight;
  if (xPct < 0 || xPct > 1 || yPct < 0 || yPct > 1) return;
  createPin(xPct, yPct);
}

function getTouchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

// ========== PHOTO VIEWER ==========
let viewerState = {
  scale: 1, x: 0, y: 0,
  minScale: 1, maxScale: 6,
  // pointer tracking
  pointers: new Map(), // pointerId -> {x, y}
  startDist: 0,
  startScale: 1,
  startMidX: 0, startMidY: 0,
  startX: 0, startY: 0,
  // double tap
  lastTapTime: 0,
  lastTapX: 0, lastTapY: 0,
  // base image size after CSS sizing
  baseW: 0, baseH: 0,
  baseOffsetX: 0, baseOffsetY: 0,
};

function applyViewerTransform() {
  const img = document.getElementById('viewer-img');
  img.style.transform = `translate(${viewerState.x}px, ${viewerState.y}px) scale(${viewerState.scale})`;
}

function resetViewerTransform() {
  viewerState.scale = 1;
  viewerState.x = 0;
  viewerState.y = 0;
  applyViewerTransform();
}

function measureViewerImage() {
  const img = document.getElementById('viewer-img');
  const rect = img.getBoundingClientRect();
  // Note: at scale=1, x=0,y=0, getBoundingClientRect returns the laid-out image rect
  viewerState.baseW = img.offsetWidth;
  viewerState.baseH = img.offsetHeight;
  // offset from stage origin (top-left) to image top-left at scale=1
  const stage = document.getElementById('viewer-stage');
  const sRect = stage.getBoundingClientRect();
  viewerState.baseOffsetX = rect.left - sRect.left;
  viewerState.baseOffsetY = rect.top - sRect.top;
}

function clampViewerPan() {
  // After scaling around (0,0) with origin top-left, image occupies:
  // x in [baseOffsetX + x, baseOffsetX + x + baseW*scale]
  // y in [baseOffsetY + y, baseOffsetY + y + baseH*scale]
  // We allow the image to be panned but keep at least some part visible.
  // Specifically, image must cover the viewport at scale > 1, otherwise center it.
  const stage = document.getElementById('viewer-stage');
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const imgW = viewerState.baseW * viewerState.scale;
  const imgH = viewerState.baseH * viewerState.scale;
  const ox = viewerState.baseOffsetX;
  const oy = viewerState.baseOffsetY;

  // Horizontal
  if (imgW <= sw) {
    // center horizontally: set x so image center == stage center
    viewerState.x = (sw - imgW) / 2 - ox;
  } else {
    const minX = sw - ox - imgW; // right edge >= sw -> ox + x + imgW >= sw -> x >= sw - ox - imgW
    const maxX = -ox;            // left edge <= 0  -> ox + x <= 0 -> x <= -ox
    if (viewerState.x < minX) viewerState.x = minX;
    if (viewerState.x > maxX) viewerState.x = maxX;
  }
  // Vertical
  if (imgH <= sh) {
    viewerState.y = (sh - imgH) / 2 - oy;
  } else {
    const minY = sh - oy - imgH;
    const maxY = -oy;
    if (viewerState.y < minY) viewerState.y = minY;
    if (viewerState.y > maxY) viewerState.y = maxY;
  }
}

function setupPhotoViewerGestures() {
  const viewer = document.getElementById('photo-viewer');
  const img = document.getElementById('viewer-img');

  const getDist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
  const getMid = (p1, p2) => ({ x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });

  // Convert client coord to image-local coord (in pre-scale image pixels relative to stage origin)
  // stageCoord = baseOffset + viewerState.{x,y} + imgLocal * scale
  // => imgLocal = (stageCoord - baseOffset - viewerState.xy) / scale
  function stagePointFromClient(cx, cy) {
    const stage = document.getElementById('viewer-stage');
    const r = stage.getBoundingClientRect();
    return { x: cx - r.left, y: cy - r.top };
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    viewer.setPointerCapture(e.pointerId);
    viewerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (viewerState.pointers.size === 1) {
      const sp = stagePointFromClient(e.clientX, e.clientY);
      viewerState.startMidX = sp.x;
      viewerState.startMidY = sp.y;
      viewerState.startX = viewerState.x;
      viewerState.startY = viewerState.y;
    } else if (viewerState.pointers.size === 2) {
      const pts = [...viewerState.pointers.values()];
      viewerState.startDist = getDist(pts[0], pts[1]);
      viewerState.startScale = viewerState.scale;
      const mid = getMid(pts[0], pts[1]);
      const sp = stagePointFromClient(mid.x, mid.y);
      viewerState.startMidX = sp.x;
      viewerState.startMidY = sp.y;
      viewerState.startX = viewerState.x;
      viewerState.startY = viewerState.y;
    }
  }

  function onPointerMove(e) {
    if (!viewerState.pointers.has(e.pointerId)) return;
    viewerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (viewerState.pointers.size === 1 && viewerState.scale > 1) {
      // pan
      const sp = stagePointFromClient(e.clientX, e.clientY);
      const dx = sp.x - viewerState.startMidX;
      const dy = sp.y - viewerState.startMidY;
      viewerState.x = viewerState.startX + dx;
      viewerState.y = viewerState.startY + dy;
      clampViewerPan();
      applyViewerTransform();
    } else if (viewerState.pointers.size === 2) {
      // pinch zoom
      const pts = [...viewerState.pointers.values()];
      const dist = getDist(pts[0], pts[1]);
      if (viewerState.startDist <= 0) {
        viewerState.startDist = dist;
        return;
      }
      let newScale = viewerState.startScale * (dist / viewerState.startDist);
      if (newScale < viewerState.minScale) newScale = viewerState.minScale;
      if (newScale > viewerState.maxScale) newScale = viewerState.maxScale;

      // Zoom around the initial midpoint (in stage coords).
      // Image-local point at start midpoint:
      // localX = (startMidX - baseOffsetX - startX) / startScale
      // After zoom, we want that same local point to remain at startMidX:
      // startMidX = baseOffsetX + newX + localX * newScale
      // => newX = startMidX - baseOffsetX - localX * newScale
      const localX = (viewerState.startMidX - viewerState.baseOffsetX - viewerState.startX) / viewerState.startScale;
      const localY = (viewerState.startMidY - viewerState.baseOffsetY - viewerState.startY) / viewerState.startScale;

      // Also account for finger drift: shift by midpoint movement
      const curMid = getMid(pts[0], pts[1]);
      const csp = stagePointFromClient(curMid.x, curMid.y);
      const driftX = csp.x - viewerState.startMidX;
      const driftY = csp.y - viewerState.startMidY;

      viewerState.scale = newScale;
      viewerState.x = viewerState.startMidX + driftX - viewerState.baseOffsetX - localX * newScale;
      viewerState.y = viewerState.startMidY + driftY - viewerState.baseOffsetY - localY * newScale;
      clampViewerPan();
      applyViewerTransform();
    }
  }

  function onPointerUp(e) {
    viewerState.pointers.delete(e.pointerId);
    try { viewer.releasePointerCapture(e.pointerId); } catch(_) {}

    // If we just dropped from 2 fingers to 1, reset single-finger start anchor
    if (viewerState.pointers.size === 1) {
      const [p] = viewerState.pointers.values();
      const sp = stagePointFromClient(p.x, p.y);
      viewerState.startMidX = sp.x;
      viewerState.startMidY = sp.y;
      viewerState.startX = viewerState.x;
      viewerState.startY = viewerState.y;
    }

    // Snap back if below min
    if (viewerState.pointers.size === 0 && viewerState.scale < 1.02) {
      resetViewerTransform();
    }
  }

  viewer.addEventListener('pointerdown', onPointerDown);
  viewer.addEventListener('pointermove', onPointerMove);
  viewer.addEventListener('pointerup', onPointerUp);
  viewer.addEventListener('pointercancel', onPointerUp);

  // Double tap to toggle zoom
  viewer.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse') return;
    // Only react when this was a tap (no pinch active)
    if (viewerState.pointers.size > 0) return;

    const now = Date.now();
    const dt = now - viewerState.lastTapTime;
    const dx = e.clientX - viewerState.lastTapX;
    const dy = e.clientY - viewerState.lastTapY;
    const dist = Math.hypot(dx, dy);

    if (dt < 300 && dist < 30) {
      // Double tap
      const sp = stagePointFromClient(e.clientX, e.clientY);
      if (viewerState.scale > 1.05) {
        resetViewerTransform();
      } else {
        const targetScale = 2.5;
        // zoom around (sp.x, sp.y)
        const localX = (sp.x - viewerState.baseOffsetX - viewerState.x) / viewerState.scale;
        const localY = (sp.y - viewerState.baseOffsetY - viewerState.y) / viewerState.scale;
        viewerState.scale = targetScale;
        viewerState.x = sp.x - viewerState.baseOffsetX - localX * targetScale;
        viewerState.y = sp.y - viewerState.baseOffsetY - localY * targetScale;
        clampViewerPan();
        applyViewerTransform();
      }
      viewerState.lastTapTime = 0;
    } else {
      viewerState.lastTapTime = now;
      viewerState.lastTapX = e.clientX;
      viewerState.lastTapY = e.clientY;
    }
  });

  // Mouse wheel zoom (for iPad with mouse / desktop)
  viewer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const sp = stagePointFromClient(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    let newScale = viewerState.scale * factor;
    if (newScale < viewerState.minScale) newScale = viewerState.minScale;
    if (newScale > viewerState.maxScale) newScale = viewerState.maxScale;
    const localX = (sp.x - viewerState.baseOffsetX - viewerState.x) / viewerState.scale;
    const localY = (sp.y - viewerState.baseOffsetY - viewerState.y) / viewerState.scale;
    viewerState.scale = newScale;
    viewerState.x = sp.x - viewerState.baseOffsetX - localX * newScale;
    viewerState.y = sp.y - viewerState.baseOffsetY - localY * newScale;
    clampViewerPan();
    applyViewerTransform();
  }, { passive: false });

  // Recompute base size after image loads
  img.addEventListener('load', () => {
    resetViewerTransform();
    measureViewerImage();
  });

  // Recompute on resize / orientation change
  window.addEventListener('resize', () => {
    if (document.getElementById('photo-viewer').classList.contains('open')) {
      resetViewerTransform();
      measureViewerImage();
    }
  });
}

function openPhotoViewer(src) {
  const img = document.getElementById('viewer-img');
  resetViewerTransform();
  img.src = src;
  document.getElementById('photo-viewer').classList.add('open');
  // measure after layout
  requestAnimationFrame(() => {
    measureViewerImage();
  });
  // Show hint, then fade
  const hint = document.getElementById('viewer-hint');
  if (hint) {
    hint.style.opacity = '1';
    clearTimeout(openPhotoViewer._hintTimer);
    openPhotoViewer._hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 2000);
  }
}
function closePhotoViewer() {
  document.getElementById('photo-viewer').classList.remove('open');
  resetViewerTransform();
}

setupPhotoViewerGestures();

// ========== EXPORT ==========
function exportReport() {
  closeModal('export-modal');
  const floor = getFloor(state.currentFloorId);
  if (!floor) { alert('図面がありません'); return; }

  const lines = [`【現場検査レポート】`, `図面: ${floor.name}`, `出力日: ${new Date().toLocaleString('ja-JP')}`, ``];
  const ok = floor.pins.filter(p=>p.status==='ok').length;
  const ng = floor.pins.filter(p=>p.status==='ng').length;
  const chk = floor.pins.filter(p=>p.status==='check').length;
  lines.push(`ピン総数: ${floor.pins.length}件 / OK:${ok} / NG:${ng} / 要確認:${chk}`, ``);

  floor.pins.forEach(pin => {
    lines.push(`--- ピン #${pin.num} ---`);
    lines.push(`状態: ${statusLabel(pin.status)}`);
    lines.push(`写真: ${pin.photos.length}枚`);
    if (pin.memo) lines.push(`メモ: ${pin.memo}`);
    lines.push('');
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `検査レポート_${floor.name}_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportZip() {
  const floor = getFloor(state.currentFloorId);
  if (!floor) { alert('図面がありません'); return; }
  const totalPhotos = floor.pins.reduce((s, p) => s + p.photos.length, 0);
  if (totalPhotos === 0) { alert('写真がありません'); return; }
  buildZip([floor]);
}

function exportZipAll() {
  const totalPhotos = state.floors.reduce((s, f) => s + f.pins.reduce((ss, p) => ss + p.photos.length, 0), 0);
  if (totalPhotos === 0) { alert('写真がありません'); return; }
  buildZip(state.floors);
}

function exportPinZip() {
  if (!_editingPin) return;
  if (_editingPin.photos.length === 0) { alert('写真がありません'); return; }
  buildPinZip(_editingPin);
}

function buildPinZip(pin) {
  if (typeof JSZip === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = () => doPinZip(pin);
    script.onerror = () => alert('JSZipの読み込みに失敗しました。ネット接続を確認してください。');
    document.head.appendChild(script);
  } else {
    doPinZip(pin);
  }
}

async function doPinZip(pin) {
  const progressWrap = document.getElementById('pin-zip-progress');
  const progressBar = document.getElementById('pin-zip-bar');
  const progressText = document.getElementById('pin-zip-text');
  progressWrap.style.display = 'block';

  const zip = new JSZip();
  const floor = getFloor(state.currentFloorId);
  const statusStr = { ok:'OK', ng:'NG', check:'確認中', none:'未設定' }[pin.status] || '未設定';

  // Add memo as txt
  if (pin.memo) {
    zip.file('memo.txt', `ピン#${pin.num} [${statusStr}]\n\n${pin.memo}\n作成: ${new Date(pin.createdAt).toLocaleString('ja-JP')}`);
  }

  pin.photos.forEach((dataUrl, i) => {
    const base64 = dataUrl.split(',')[1];
    const ext = dataUrl.includes('image/png') ? 'png' : 'jpg';
    zip.file(`${String(i+1).padStart(2,'0')}.${ext}`, base64, { base64: true });
    const pct = Math.round((i+1) / pin.photos.length * 80);
    progressBar.style.width = pct + '%';
    progressText.textContent = `まとめています... ${i+1}/${pin.photos.length}枚`;
  });

  progressText.textContent = '圧縮中...';
  progressBar.style.width = '90%';

  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  const date = new Date().toLocaleDateString('ja-JP').replace(/\//g,'-');
  const floorName = floor ? floor.name : '図面';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${floorName}_ピン${pin.num}_${statusStr}_${date}.zip`;
  a.click();
  URL.revokeObjectURL(url);

  progressBar.style.width = '100%';
  progressText.textContent = 'ダウンロード完了！';
  setTimeout(() => {
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
  }, 2000);
}


function buildZip(floors) {
  if (typeof JSZip === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = () => doZip(floors);
    script.onerror = () => alert('JSZipの読み込みに失敗しました。ネット接続を確認してください。');
    document.head.appendChild(script);
  } else {
    doZip(floors);
  }
}

async function doZip(floors) {
  const progressWrap = document.getElementById('export-progress');
  const progressBar = document.getElementById('export-progress-bar');
  const progressText = document.getElementById('export-progress-text');
  progressWrap.style.display = 'block';

  const zip = new JSZip();
  let total = floors.reduce((s, f) => s + f.pins.reduce((ss, p) => ss + p.photos.length, 0), 0);
  let done = 0;

  for (const floor of floors) {
    const floorFolder = zip.folder(floor.name);

    // Add report txt in each floor folder
    const lines = [`図面: ${floor.name}`, `出力日: ${new Date().toLocaleString('ja-JP')}`, ``];
    floor.pins.forEach(pin => {
      lines.push(`ピン#${pin.num} [${statusLabel(pin.status).replace(/[✅❌⚠️]/g,'').trim()}] 写真${pin.photos.length}枚`);
      if (pin.memo) lines.push(`  メモ: ${pin.memo}`);
    });
    floorFolder.file('report.txt', lines.join('\n'));

    for (const pin of floor.pins) {
      if (pin.photos.length === 0) continue;
      const statusStr = { ok:'OK', ng:'NG', check:'確認中', none:'未設定' }[pin.status] || '未設定';
      const folderName = `ピン${pin.num}_${statusStr}`;
      const pinFolder = floorFolder.folder(folderName);

      pin.photos.forEach((dataUrl, i) => {
        const base64 = dataUrl.split(',')[1];
        const ext = dataUrl.includes('image/png') ? 'png' : 'jpg';
        pinFolder.file(`${String(i+1).padStart(2,'0')}.${ext}`, base64, { base64: true });
        done++;
        const pct = Math.round(done / total * 100);
        progressBar.style.width = pct + '%';
        progressText.textContent = `ZIPを作成中... ${done}/${total}枚`;
      });
    }
  }

  progressText.textContent = 'ZIPを圧縮中...';
  progressBar.style.width = '100%';

  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  const date = new Date().toLocaleDateString('ja-JP').replace(/\//g,'-');
  const name = floors.length === 1 ? floors[0].name : '全図面';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `現場検査_${name}_${date}.zip`;
  a.click();
  URL.revokeObjectURL(url);

  progressWrap.style.display = 'none';
  progressBar.style.width = '0%';
  closeModal('export-modal');
}





// ========== BACKUP / IMPORT ==========
const BACKUP_VERSION = 1;
let _pendingImport = null; // {folders, floors}

function estimateBackupSize() {
  // Rough: sum length of dataURLs as bytes proxy
  let bytes = 0;
  for (const f of state.floors) {
    if (f.imageData) bytes += f.imageData.length;
    for (const p of (f.pins || [])) {
      for (const ph of (p.photos || [])) bytes += ph.length;
    }
  }
  return bytes;
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}

function exportBackup() {
  const approx = estimateBackupSize();
  if (state.folders.length === 0 && state.floors.length === 0) {
    alert('バックアップ対象のデータがありません');
    return;
  }
  if (approx > 200 * 1024 * 1024) {
    if (!confirm(`バックアップサイズが約 ${formatBytes(approx)} と大きいです。\n書き出しに時間がかかる可能性があります。続行しますか？`)) return;
  }

  closeModal('export-modal');

  try {
    const backup = {
      app: 'inspection_app_v2',
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      folders: state.folders,
      floors: state.floors,
    };
    const json = JSON.stringify(backup);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toLocaleDateString('ja-JP').replace(/\//g,'-');
    a.href = url;
    a.download = `現場検査_バックアップ_${date}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(e) {
    alert('バックアップ書き出し失敗: ' + e.message);
  }
}

function handleBackupFile(input) {
  const file = input.files && input.files[0];
  input.value = ''; // allow re-selecting same file later
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('JSONの形式が不正です');
      if (!Array.isArray(data.folders) || !Array.isArray(data.floors)) {
        throw new Error('folders / floors が見つかりません');
      }
      // Light validation
      for (const fl of data.floors) {
        if (typeof fl.id !== 'string' || typeof fl.name !== 'string') {
          throw new Error('図面データの形式が不正です');
        }
        if (!Array.isArray(fl.pins)) fl.pins = [];
      }
      _pendingImport = data;
      showImportSummary(data);
      openModal('import-modal');
    } catch(err) {
      alert('読み込めませんでした: ' + err.message);
    }
  };
  reader.onerror = () => alert('ファイルの読み込みに失敗しました');
  reader.readAsText(file);
}

function showImportSummary(data) {
  const folderCount = data.folders.length;
  const floorCount = data.floors.length;
  let pinCount = 0, photoCount = 0;
  for (const f of data.floors) {
    pinCount += (f.pins || []).length;
    for (const p of (f.pins || [])) photoCount += (p.photos || []).length;
  }
  const exported = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '不明';
  const el = document.getElementById('import-summary');
  el.innerHTML = `
    <div>書き出し日時: ${exported}</div>
    <div>フォルダ: ${folderCount}件 / 図面: ${floorCount}件</div>
    <div>ピン: ${pinCount}件 / 写真: ${photoCount}枚</div>
  `;
}

function cancelImport() {
  _pendingImport = null;
  closeModal('import-modal');
}

async function confirmImport(mode) {
  if (!_pendingImport) { closeModal('import-modal'); return; }

  if (mode === 'replace') {
    if (!confirm('既存データを全て削除して、バックアップで置き換えます。\nこの操作は元に戻せません。よろしいですか？')) return;
  }

  const data = _pendingImport;

  try {
    if (mode === 'replace') {
      state.folders = JSON.parse(JSON.stringify(data.folders));
      state.floors = JSON.parse(JSON.stringify(data.floors));
    } else {
      // merge: re-ID anything that collides
      const existingFolderIds = new Set(state.folders.map(f => f.id));
      const existingFloorIds = new Set(state.floors.map(f => f.id));
      const folderIdMap = {}; // oldId -> newId

      const maxFolderOrder = state.folders.reduce((m,f)=>Math.max(m, f.order||0), -1);
      const maxFloorOrder = state.floors.reduce((m,f)=>Math.max(m, f.order||0), -1);

      data.folders.forEach((f, i) => {
        const copy = JSON.parse(JSON.stringify(f));
        if (existingFolderIds.has(copy.id)) {
          const newId = 'folder_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
          folderIdMap[copy.id] = newId;
          copy.id = newId;
        }
        copy.order = maxFolderOrder + 1 + i;
        state.folders.push(copy);
        existingFolderIds.add(copy.id);
      });

      data.floors.forEach((fl, i) => {
        const copy = JSON.parse(JSON.stringify(fl));
        if (existingFloorIds.has(copy.id)) {
          copy.id = 'floor_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        }
        // remap folderId if folder was renamed
        if (copy.folderId && folderIdMap[copy.folderId]) {
          copy.folderId = folderIdMap[copy.folderId];
        }
        // if folderId references a non-existent folder, create / attach to "復元" folder
        if (!copy.folderId || !state.folders.some(f => f.id === copy.folderId)) {
          let restoredFolder = state.folders.find(f => f.name === '復元');
          if (!restoredFolder) {
            restoredFolder = {
              id: 'folder_restored_' + Date.now(),
              name: '復元',
              order: maxFolderOrder + 1 + data.folders.length,
            };
            state.folders.push(restoredFolder);
          }
          copy.folderId = restoredFolder.id;
        }
        copy.order = maxFloorOrder + 1 + i;
        state.floors.push(copy);
        existingFloorIds.add(copy.id);
      });
    }

    await save();

    // refresh UI
    if (state.folders.length > 0) {
      const sortedFolders = [...state.folders].sort((a,b)=>(a.order||0)-(b.order||0));
      state.currentFolderId = sortedFolders[0].id;
    }
    renderFolderTabs();
    renderFloorTabs();
    const floorsInFolder = getFloorsInFolder(state.currentFolderId);
    if (floorsInFolder.length > 0) {
      selectFloor(floorsInFolder.sort((a,b)=>(a.order||0)-(b.order||0))[0].id);
    } else {
      showNoPlan();
    }

    _pendingImport = null;
    closeModal('import-modal');
    closeModal('export-modal');
    alert(mode === 'replace' ? '復元が完了しました（上書き）' : '復元が完了しました（マージ）');
  } catch(e) {
    alert('復元に失敗しました: ' + e.message);
  }
}


// ========== RESET ==========
async function resetAllData() {
  if (!confirm('全データ（フォルダ・図面・ピン・写真）を削除して初期化しますか？\nこの操作は元に戻せません。')) return;
  try {
    const db = await openDB();
    db.close();
    _db = null;
    await new Promise((res, rej) => {
      const req = indexedDB.deleteDatabase(DB_NAME); indexedDB.deleteDatabase('inspection_app');
      req.onsuccess = res;
      req.onerror = rej;
    });
    localStorage.clear();
    alert('リセット完了。再読み込みします。');
    location.reload();
  } catch(e) {
    alert('リセット失敗: ' + e.message);
  }
}

// ========== START ==========
init();
